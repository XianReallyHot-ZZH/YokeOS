<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="470" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀，26 节同款） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykgr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
    <marker id="ykrd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
  <text x="410" y="26" fill="#334155" font-size="15" font-weight="bold" text-anchor="middle">人推链路八站：一次「天气穿搭 + 推送」对话从头到尾（第 27 节）</text>

  <!-- ════════ 三入口（同一引擎） ════════ -->
  <rect x="40" y="42" width="230" height="48" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="155" y="62" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">① CLI · yokeos chat</text>
  <text x="155" y="80" fill="#6366f1" font-size="10.5" text-anchor="middle">三元组 channel=cli</text>
  <rect x="295" y="42" width="230" height="48" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="410" y="62" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">① REST · POST /sessions/{id}/messages</text>
  <text x="410" y="80" fill="#6366f1" font-size="10.5" text-anchor="middle">三元组 channel=web</text>
  <rect x="550" y="42" width="230" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="665" y="62" fill="#475569" font-size="13" font-weight="bold" text-anchor="middle">管理台 · /admin 只读</text>
  <text x="665" y="80" fill="#64748b" font-size="10.5" text-anchor="middle">同一组端点的第三张脸（虚线=只读）</text>

  <line x1="155" y1="90" x2="345" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <line x1="410" y1="90" x2="410" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>

  <!-- ════════ ②③ 编排与组装 ════════ -->
  <rect x="280" y="122" width="260" height="52" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="143" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">② AgentService.process</text>
  <text x="410" y="162" fill="#92400e" font-size="10.5" text-anchor="middle">三触发源统一入口 · 查 Profile · set ProfileContext</text>
  <line x1="410" y1="174" x2="410" y2="196" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <rect x="280" y="200" width="260" height="52" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="221" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">③ PromptBuilder</text>
  <text x="410" y="240" fill="#92400e" font-size="10.5" text-anchor="middle">system prompt + 记忆 + 历史 + 点名工具</text>

  <!-- ════════ ④ Provider（左） ⇄ ⑥ ToolExecutor（右） ════════ -->
  <line x1="410" y1="252" x2="200" y2="282" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <line x1="410" y1="252" x2="620" y2="282" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <rect x="60" y="286" width="280" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.2"/>
  <text x="200" y="308" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">④ ProviderService → LLM</text>
  <text x="200" y="326" fill="#1e40af" font-size="10.5" text-anchor="middle">显式映射选模型 · 自动执行关闭 · 每调写 llm_calls</text>
  <rect x="480" y="286" width="280" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.2"/>
  <text x="620" y="308" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">⑥ ToolExecutor（唯一执行权）</text>
  <text x="620" y="326" fill="#1e40af" font-size="10.5" text-anchor="middle">Sandbox.enforce → 执行 → 写 tool_invocations</text>

  <!-- ④→⑥：带 tool call 的回复 -->
  <line x1="340" y1="314" x2="480" y2="314" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <text x="410" y="306" fill="#1e40af" font-size="10" text-anchor="middle">⑤ 返回 tool call</text>
  <!-- ⑥→⑦ 工具站 -->
  <line x1="620" y1="342" x2="620" y2="366" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <rect x="480" y="370" width="280" height="48" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2.2"/>
  <text x="620" y="390" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">⑦ 工具 · http_get 查天气 + notify 推送</text>
  <text x="620" y="408" fill="#166534" font-size="10.5" text-anchor="middle">两次涉外都过域名白名单 · webhook 接收端收到 POST</text>

  <!-- ⑦ 结果回 Session → 重新组装（ReAct 回环） -->
  <path d="M 480 394 C 340 394 200 394 200 342" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ykrd)"/>
  <text x="238" y="388" fill="#b91c1c" font-size="10.5" text-anchor="middle">⑧ 结果回填 Session → 回到③（默认最多 10 轮）</text>

  <!-- ════════ 落库对账（底部） ════════ -->
  <rect x="40" y="430" width="740" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="410" y="450" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">对账（不多不少）：sessions 恰 1 · llm_calls ≥2 全成功 · tool_invocations 恰 2（http_get + notify）· MEMORY.md 不动 · 三入口同一份数据</text>
</svg>
