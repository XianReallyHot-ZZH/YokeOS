<svg viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="330" fill="#ffffff"/>
  <defs>
    <marker id="yks9" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykpu9" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/></marker>
  </defs>

  <!-- Entry paths -->
  <rect x="40" y="40" width="220" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="64" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">CLI · 人推</text>
  <text x="150" y="84" fill="#334155" font-size="10" text-anchor="middle">yokeos chat</text>
  <rect x="300" y="40" width="220" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="64" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">Web Service · 人推</text>
  <text x="410" y="84" fill="#334155" font-size="10" text-anchor="middle">REST API</text>
  <rect x="560" y="40" width="220" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="670" y="64" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">AgentScheduler · 钟推</text>
  <text x="670" y="84" fill="#92400e" font-size="9.5" text-anchor="middle">frontmatter schedules · cron 到点</text>

  <!-- Collector -->
  <line x1="150" y1="96" x2="150" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="96" x2="410" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="670" y1="96" x2="670" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="150" y1="140" x2="670" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="140" x2="410" y2="162" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks9)"/>

  <!-- Unified entry -->
  <rect x="185" y="166" width="450" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="190" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">AgentService.process（统一入口）</text>
  <text x="410" y="210" fill="#334155" font-size="10" text-anchor="middle">ReActLoop 不感知消息从哪个入口来 —— 调用链路跟人推完全一样</text>

  <!-- State store -->
  <line x1="410" y1="222" x2="410" y2="258" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#ykpu9)"/>
  <rect x="185" y="262" width="450" height="52" rx="8" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="410" y="284" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">scheduled_tasks / task_executions</text>
  <text x="410" y="302" fill="#7c3aed" font-size="9.5" text-anchor="middle">任务状态 + 执行历史落库 · 重启不丢 · ScheduledTaskStore 契约在 core、实现在 storage</text>

  <path d="M781,68 L800,68 L800,288 L639,288" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#ykpu9)"/>
  <text x="806" y="180" fill="#a855f7" font-size="9" text-anchor="middle" transform="rotate(90 806 180)">reconcile 登记 · recordExecution 留痕</text>
</svg>
