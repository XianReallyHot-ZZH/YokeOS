<svg viewBox="0 0 910 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="910" height="470" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykgr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="ykpu" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/></marker>
  </defs>
  <!-- ════════ 旁注：Profile 来源（YokeOS：AGENT.md frontmatter 派生） ════════ -->
  <rect x="40" y="24" width="230" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="155" y="46" fill="#475569" font-size="13" font-weight="bold" text-anchor="middle">AGENT.md frontmatter</text>
  <text x="155" y="62" fill="#64748b" font-size="9.5" text-anchor="middle">AgentLoader.deriveProfile() → Profile</text>
  <line x1="155" y1="70" x2="155" y2="96" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#yks)"/>
  <!-- ════════ 第一行：调用链 ════════ -->
  <rect x="40" y="100" width="190" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="135" y="122" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">ReActLoop</text>
  <text x="135" y="140" fill="#6366f1" font-size="10" text-anchor="middle">上层 · 第 17 节交付</text>
  <rect x="390" y="100" width="230" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="505" y="122" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">ProviderService</text>
  <text x="505" y="140" fill="#92400e" font-size="10" text-anchor="middle">chat(sessionId, Profile, Prompt)</text>
  <rect x="740" y="100" width="130" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="805" y="122" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">ChatModel</text>
  <text x="805" y="140" fill="#334155" font-size="10" text-anchor="middle">Spring AI</text>
  <!-- 调用与返回（左走廊） -->
  <line x1="230" y1="118" x2="386" y2="118" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <text x="308" y="112" fill="#64748b" font-size="11" text-anchor="middle">调用</text>
  <line x1="390" y1="138" x2="234" y2="138" stroke="#22c55e" stroke-width="2" marker-end="url(#ykgr)"/>
  <text x="312" y="153" fill="#64748b" font-size="10" text-anchor="middle">Response</text>
  <!-- 调用与返回（右走廊） -->
  <line x1="620" y1="118" x2="736" y2="118" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <text x="678" y="111" fill="#b91c1c" font-size="9" text-anchor="middle">autoExecuteTools=false</text>
  <line x1="740" y1="138" x2="624" y2="138" stroke="#22c55e" stroke-width="2" marker-end="url(#ykgr)"/>
  <text x="682" y="153" fill="#64748b" font-size="10" text-anchor="middle">Response</text>
  <!-- ════════ 审计双路 fan-out ════════ -->
  <line x1="505" y1="150" x2="505" y2="210" stroke="#f59e0b" stroke-width="2"/>
  <line x1="410" y1="210" x2="645" y2="210" stroke="#f59e0b" stroke-width="2"/>
  <line x1="410" y1="210" x2="410" y2="234" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <line x1="645" y1="210" x2="645" y2="234" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <rect x="320" y="236" width="180" height="46" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="410" y="258" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">调用成功 · success=true</text>
  <text x="410" y="274" fill="#166534" font-size="10" text-anchor="middle">token 三项 + 耗时</text>
  <rect x="545" y="236" width="200" height="46" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="645" y="258" fill="#b91c1c" font-size="13" font-weight="bold" text-anchor="middle">调用失败 · success=false</text>
  <text x="645" y="274" fill="#b91c1c" font-size="10" text-anchor="middle">error_message 记原因 · 异常上抛</text>
  <!-- ════════ 汇入 llm_calls（purple 数据角色） ════════ -->
  <line x1="410" y1="282" x2="410" y2="306" stroke="#a855f7" stroke-width="2"/>
  <line x1="645" y1="282" x2="645" y2="306" stroke="#a855f7" stroke-width="2"/>
  <line x1="410" y1="306" x2="645" y2="306" stroke="#a855f7" stroke-width="2"/>
  <line x1="527" y1="306" x2="527" y2="332" stroke="#a855f7" stroke-width="2" marker-end="url(#ykpu)"/>
  <rect x="397" y="334" width="260" height="50" rx="8" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="527" y="357" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">llm_calls 表</text>
  <text x="527" y="375" fill="#7c3aed" font-size="10" text-anchor="middle">含 success / error_message 列</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="455" y="416" fill="#475569" font-size="12" text-anchor="middle">① 显式映射：按 profile.provider 取 ChatModel，查无此名抛 ProviderNotFoundException</text>
  <text x="455" y="438" fill="#475569" font-size="12" text-anchor="middle">② 工具 schema 只翻译不执行；③ 调用成败都落审计，失败记 error_message 后异常继续上抛</text>
</svg>
