<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykpu" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/></marker>
  </defs>

  <!-- ════════ 两层记忆 ════════ -->
  <rect x="80" y="110" width="220" height="86" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="190" y="138" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">短期记忆 · 会话</text>
  <text x="190" y="160" fill="#334155" font-size="10" text-anchor="middle">这一次对话的工作台</text>
  <text x="190" y="178" fill="#334155" font-size="10" text-anchor="middle">Session（SQLite）· 容量有限</text>

  <rect x="520" y="110" width="220" height="86" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="630" y="138" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">长期记忆 · 跨会话</text>
  <text x="630" y="160" fill="#7c3aed" font-size="10" text-anchor="middle">外部仓库，用时检索拼回</text>
  <text x="630" y="178" fill="#7c3aed" font-size="10" text-anchor="middle">MEMORY.md / memory_entries / Mem0</text>

  <!-- ════════ 固化：短期 → 长期（写出去） ════════ -->
  <text x="410" y="50" fill="#b45309" font-size="11.5" text-anchor="middle">固化：重要的写出去 —— Agent 主动 save_memory</text>
  <path d="M190,110 L190,62 L630,62 L630,104" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>

  <!-- ════════ 检索：长期 → 短期（读回来） ════════ -->
  <path d="M630,196 L630,244 L190,244 L190,202" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#ykpu)"/>
  <text x="410" y="266" fill="#6b21a8" font-size="11.5" text-anchor="middle">检索：相关的读回来 —— recall_memory / 组装 Prompt 注入</text>

  <!-- ════════ 结论行 ════════ -->
  <text x="410" y="296" fill="#64748b" font-size="10.5" text-anchor="middle">短期是工作台、长期是仓库——这个循环让记忆跨会话流动，context window 不再是记忆的上限</text>
</svg>
