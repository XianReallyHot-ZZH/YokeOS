<svg viewBox="0 0 860 410" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="410" fill="#ffffff"/>
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <!-- ════════ 墙之上：动作发生处（调用方，只认接口） ════════ -->
  <rect x="180" y="36" width="500" height="58" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="430" y="58" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">动作发生处（模型可经工具调用触发的动作）</text>
  <text x="430" y="78" fill="#6366f1" font-size="10" text-anchor="middle">FileTools · ShellTools · HttpTools · NotifyTools · Memory 档后端</text>
  <line x1="430" y1="94" x2="430" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>

  <!-- ════════ 那道墙：Sandbox 接口（本章主角） ════════ -->
  <rect x="180" y="126" width="500" height="68" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="430" y="150" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">Sandbox.enforce(SandboxAction)</text>
  <text x="430" y="168" fill="#92400e" font-size="10" text-anchor="middle">FILE_READ | FILE_WRITE | SHELL_COMMAND | HTTP_REQUEST</text>
  <text x="430" y="184" fill="#92400e" font-size="9.5" text-anchor="middle">ActionType 四值 · 接口不携带任何一档实现特有的概念（宪法 6）</text>

  <!-- 旁注：接口中立性校验法 -->
  <rect x="706" y="140" width="138" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="775" y="158" fill="#475569" font-size="9.5" text-anchor="middle">microVM 反套校验</text>
  <text x="775" y="172" fill="#475569" font-size="9.5" text-anchor="middle">接口中立性</text>
  <line x1="706" y1="162" x2="684" y2="162" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>

  <!-- ════════ 一分三 collector：接口 → 可插拔实现 ════════ -->
  <line x1="430" y1="194" x2="430" y2="222" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="180" y1="222" x2="680" y2="222" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="180" y1="222" x2="180" y2="248" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>
  <line x1="430" y1="222" x2="430" y2="248" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>
  <line x1="680" y1="222" x2="680" y2="248" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>

  <!-- ════════ 墙之下：可插拔实现（换档只新增实现类） ════════ -->
  <rect x="70" y="252" width="220" height="84" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="180" y="276" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">WhitelistSandbox</text>
  <text x="180" y="296" fill="#7c3aed" font-size="9.5" text-anchor="middle">三重白名单 · 校验真实路径</text>
  <text x="180" y="314" fill="#7c3aed" font-size="9.5" text-anchor="middle">第一阶段唯一实现</text>

  <rect x="320" y="252" width="220" height="84" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="430" y="276" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">容器隔离</text>
  <text x="430" y="296" fill="#7c3aed" font-size="9.5" text-anchor="middle">namespace+cgroups+seccomp</text>
  <text x="430" y="314" fill="#7c3aed" font-size="9.5" text-anchor="middle">扩展阶段 · 新增实现类</text>

  <rect x="570" y="252" width="220" height="84" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="680" y="276" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">microVM</text>
  <text x="680" y="296" fill="#7c3aed" font-size="9.5" text-anchor="middle">Firecracker · Kata · gVisor</text>
  <text x="680" y="314" fill="#7c3aed" font-size="9.5" text-anchor="middle">扩展阶段 · 新增实现类</text>

  <!-- ════════ 结论行 ════════ -->
  <text x="430" y="382" fill="#475569" font-size="12" text-anchor="middle">换档 = 新增实现类 + 配置选档——接口与调用方零改动（宪法 6）</text>
</svg>
