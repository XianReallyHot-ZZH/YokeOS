<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>
  <!-- ════════ 左：frontmatter 声明（配置，虚线旁注） ════════ -->
  <rect x="40" y="64" width="224" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="152" y="90" fill="#475569" font-size="12.5" font-weight="bold" text-anchor="middle">AGENT.md · schedules</text>
  <text x="152" y="110" fill="#64748b" font-size="9.5" text-anchor="middle">id / cron / zone / message（16 节解析建全）</text>
  <line x1="264" y1="96" x2="292" y2="96" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ 主角：AgentScheduler ════════ -->
  <rect x="300" y="52" width="244" height="88" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="422" y="80" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">AgentScheduler（钟推）</text>
  <text x="422" y="102" fill="#92400e" font-size="10.5" text-anchor="middle">启动注册 · 到点触发 · 重叠锁与留痕</text>
  <text x="422" y="120" fill="#92400e" font-size="10.5" text-anchor="middle">状态与历史落 SQLite 两表</text>
  <!-- ════════ 右：同一入口 ════════ -->
  <line x1="544" y1="96" x2="554" y2="96" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <rect x="560" y="64" width="220" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="670" y="90" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">AgentService.process</text>
  <text x="670" y="110" fill="#334155" font-size="10" text-anchor="middle">与人推（CLI / Web）完全同一入口</text>
  <!-- ════════ 下方：不管的两件事（虚线旁注） ════════ -->
  <line x1="422" y1="140" x2="422" y2="172" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,3"/>
  <line x1="218" y1="172" x2="602" y2="172" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,3"/>
  <line x1="218" y1="172" x2="218" y2="228" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#yks)"/>
  <line x1="602" y1="172" x2="602" y2="228" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#yks)"/>
  <rect x="48" y="232" width="340" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="218" y="256" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">消息里说什么 —— frontmatter 作者的事</text>
  <text x="218" y="274" fill="#64748b" font-size="9.5" text-anchor="middle">cron 到点拼的那句话本身就是声明的一部分</text>
  <rect x="432" y="232" width="340" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="602" y="256" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">交上去怎么处理 —— ReAct / Tool / Provider 的事</text>
  <text x="602" y="274" fill="#64748b" font-size="9.5" text-anchor="middle">循环、沙箱、审计在既有链路里，一个字不用改</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="410" y="336" fill="#475569" font-size="12" text-anchor="middle">定时任务不是新能力，是第三种触发源——薄薄一层：到点了、拼消息、交入口</text>
  <text x="410" y="356" fill="#94a3b8" font-size="10.5" text-anchor="middle">状态与历史落 scheduled_tasks / task_executions（reconcile 幂等 + recordExecution）；定义源始终是 frontmatter</text>
  <text x="410" y="376" fill="#94a3b8" font-size="10.5" text-anchor="middle">两件「不管的事」各归其位——模块不膨胀成小型工作流引擎</text>
</svg>
