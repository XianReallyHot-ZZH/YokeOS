<svg viewBox="0 0 820 650" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="650" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykgr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
  </defs>
  <!-- ════════ 触发入口双源（indigo） ════════ -->
  <rect x="60" y="24" width="300" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="210" y="50" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">人推补跑（验证用）</text>
  <text x="210" y="70" fill="#6366f1" font-size="10" text-anchor="middle">yokeos chat / POST /agents/{name}/invoke</text>
  <rect x="460" y="24" width="300" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="610" y="50" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">钟推 · AgentScheduler</text>
  <text x="610" y="70" fill="#6366f1" font-size="10" text-anchor="middle">cron 08:00 / 09:00 到点自跑（第三触发源）</text>
  <!-- ════════ 汇流 → 同一条执行链（amber 主角） ════════ -->
  <line x1="210" y1="88" x2="210" y2="100" stroke="#6366f1" stroke-width="2"/>
  <line x1="610" y1="88" x2="610" y2="100" stroke="#6366f1" stroke-width="2"/>
  <line x1="210" y1="100" x2="610" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="100" x2="410" y2="112" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <rect x="190" y="116" width="440" height="68" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="142" fill="#b45309" font-size="15" font-weight="bold" text-anchor="middle">AgentService.process——同一条执行链</text>
  <text x="410" y="162" fill="#92400e" font-size="9.5" text-anchor="middle">ReAct 循环不感知触发来源；审计与 Session 同一套（25 节拍板）</text>
  <text x="410" y="178" fill="#92400e" font-size="9.5" text-anchor="middle">钟推落 Session 时 channel=user=scheduler</text>
  <!-- ════════ 分叉：两条 Demo 泳道头部（blue） ════════ -->
  <line x1="410" y1="184" x2="410" y2="196" stroke="#f59e0b" stroke-width="2"/>
  <line x1="224" y1="196" x2="596" y2="196" stroke="#f59e0b" stroke-width="2"/>
  <line x1="224" y1="196" x2="224" y2="208" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <line x1="596" y1="196" x2="596" y2="208" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <rect x="56" y="212" width="336" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="224" y="236" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">Demo 一 · 每日天气</text>
  <text x="224" y="256" fill="#334155" font-size="10" text-anchor="middle">光杆 AGENT.md · API/管理台创建 · cron 08:00</text>
  <rect x="428" y="212" width="336" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="596" y="236" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">Demo 二 · 每日科技日报</text>
  <text x="596" y="256" fill="#334155" font-size="10" text-anchor="middle">AGENT.md + 公共 Skill + MCP · 手写目录丢入 · cron 09:00</text>
  <!-- ════════ 左泳道能力 chips（中性） ════════ -->
  <rect x="56" y="282" width="336" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="224" y="303" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">能力一 · Provider 抽象——DeepSeek 真调</text>
  <rect x="56" y="324" width="336" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="224" y="345" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">能力二 · ReAct 循环——思考→调工具→续推</text>
  <rect x="56" y="366" width="336" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="224" y="387" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">能力四 · 内置 http_get——过域名白名单</text>
  <rect x="56" y="408" width="336" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="224" y="429" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">能力五 · Notify 推送 + cron 定时触发</text>
  <rect x="56" y="450" width="336" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="224" y="471" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">能力六 · Session 查询——GET /sessions/{id}</text>
  <!-- ════════ 右泳道能力 chips（中性） ════════ -->
  <rect x="428" y="282" width="336" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="596" y="303" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">能力三 · Memory——MEMORY.md 偏好跨天生效</text>
  <rect x="428" y="324" width="336" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="596" y="345" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">能力四 · 公共 Skill 按名引用——注入 prompt</text>
  <rect x="428" y="366" width="336" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="596" y="387" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">能力四 · news MCP——自写最小 server（方式二）</text>
  <rect x="428" y="408" width="336" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="596" y="429" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">能力五 · cron 定时 + Notify 推送</text>
  <rect x="428" y="450" width="336" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="596" y="471" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">全程零 Java——只写 markdown 与 yaml 配置</text>
  <!-- ════════ 汇流 → 发布硬条件（green） ════════ -->
  <line x1="224" y1="482" x2="224" y2="502" stroke="#94a3b8" stroke-width="2"/>
  <line x1="596" y1="482" x2="596" y2="502" stroke="#94a3b8" stroke-width="2"/>
  <line x1="224" y1="502" x2="596" y2="502" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="502" x2="410" y2="510" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <rect x="60" y="514" width="700" height="64" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="410" y="540" fill="#15803d" font-size="14" font-weight="bold" text-anchor="middle">合起来 = 六个核心能力 + 第三触发源，一个不缺</text>
  <text x="410" y="562" fill="#166534" font-size="10.5" text-anchor="middle">两个 Demo 跑通是核心功能发布的硬条件（需 §13 场景验收）</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="410" y="612" fill="#475569" font-size="13" font-weight="bold" text-anchor="middle">人推与钟推走同一个 AgentService.process——从哪个入口触发，链路与审计都一样</text>
  <text x="410" y="632" fill="#94a3b8" font-size="10.5" text-anchor="middle">目录形态各演一个：光杆 AGENT.md（Demo 一）与公共 Skill + MCP（Demo 二）；「目录带脚本」形态 29 节 fixture 已实证</text>
</svg>
