<svg viewBox="0 0 820 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="660" fill="#ffffff"/>
  <defs>
    <marker id="yks10" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam10" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykgr10" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
  </defs>

  <!-- Generate draft (preview only) -->
  <rect x="40" y="30" width="230" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="155" y="52" fill="#475569" font-size="10.5" font-weight="bold" text-anchor="middle">POST /api/v1/agents/generate</text>
  <text x="155" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">一句话生成草稿 · 不落盘不注册 · 人过目可改</text>

  <!-- API path -->
  <line x1="155" y1="86" x2="155" y2="114" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#yks10)"/>
  <rect x="40" y="118" width="230" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="155" y="144" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">POST /api/v1/agents</text>
  <text x="155" y="164" fill="#6366f1" font-size="10" text-anchor="middle">校验 + 写 Agent 目录</text>

  <!-- Drop-dir path -->
  <rect x="550" y="118" width="230" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="665" y="144" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">手工丢目录</text>
  <text x="665" y="164" fill="#6366f1" font-size="10" text-anchor="middle">scp · git · 编辑器</text>
  <line x1="665" y1="182" x2="665" y2="216" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks10)"/>
  <rect x="550" y="220" width="230" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="665" y="244" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">WorkspaceWatcher</text>
  <text x="665" y="264" fill="#334155" font-size="10" text-anchor="middle">JDK WatchService 实时监听 agents/</text>

  <!-- Converge to register (hero) -->
  <path d="M155,182 L155,352 L291,352" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam10)"/>
  <path d="M665,276 L665,352 L529,352" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam10)"/>
  <rect x="295" y="320" width="230" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="344" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">AgentLifecycleService</text>
  <text x="410" y="362" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">.register(agentDir)</text>
  <text x="410" y="378" fill="#92400e" font-size="9.5" text-anchor="middle">两条录入路径 · 同一段注册代码</text>

  <!-- Derive & register -->
  <line x1="410" y1="384" x2="410" y2="414" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks10)"/>
  <rect x="295" y="418" width="230" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="440" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">AgentLoader.deriveProfile</text>
  <text x="410" y="457" fill="#334155" font-size="9.5" text-anchor="middle">frontmatter 派生 Profile · 零改动复用底座</text>
  <line x1="410" y1="466" x2="410" y2="488" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks10)"/>
  <rect x="295" y="492" width="230" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="514" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">ProfileRegistry.register</text>
  <text x="410" y="531" fill="#334155" font-size="9.5" text-anchor="middle">运行时方法 · 与启动扫描同一段代码</text>

  <!-- Outcomes -->
  <line x1="410" y1="540" x2="410" y2="558" stroke="#94a3b8" stroke-width="2"/>
  <line x1="210" y1="558" x2="610" y2="558" stroke="#94a3b8" stroke-width="2"/>
  <line x1="210" y1="558" x2="210" y2="574" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks10)"/>
  <line x1="610" y1="558" x2="610" y2="574" stroke="#22c55e" stroke-width="2" marker-end="url(#ykgr10)"/>

  <rect x="40" y="578" width="340" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="210" y="601" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">有 schedules → AgentScheduler 注册定时</text>
  <text x="210" y="621" fill="#334155" font-size="10" text-anchor="middle">定时任务随 Agent 一起上线</text>
  <rect x="440" y="578" width="340" height="56" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="610" y="601" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">目录就位即上线 · 全程免重启</text>
  <text x="610" y="621" fill="#166534" font-size="10" text-anchor="middle">API 创建 = 丢目录，行为一模一样</text>
</svg>
