<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="480" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
    <marker id="ykpu" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/></marker>
    <marker id="ykrd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
  <!-- ════════ 中列主线：到点 → 查启用 → execute → 记账 → 两表 ════════ -->
  <rect x="150" y="24" width="520" height="48" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="410" y="44" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">CronTrigger 到点</text>
  <text x="410" y="62" fill="#6366f1" font-size="9.5" text-anchor="middle">ThreadPoolTaskScheduler · daemon 线程（坑七：一次性命令跑完 JVM 可退）</text>
  <line x1="410" y1="72" x2="410" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <rect x="210" y="96" width="400" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="116" fill="#1d4ed8" font-size="12.5" font-weight="bold" text-anchor="middle">runOnce —— isEnabled(taskId)?</text>
  <text x="410" y="133" fill="#334155" font-size="9.5" text-anchor="middle">未登记按启用处理（fail-open）</text>
  <line x1="410" y1="142" x2="410" y2="162" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <rect x="190" y="166" width="440" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="192" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">AgentScheduler.execute</text>
  <text x="410" y="214" fill="#92400e" font-size="10.5" text-anchor="middle">tryLock(taskId) → 钟推会话 → AgentService.process</text>
  <text x="410" y="232" fill="#92400e" font-size="10.5" text-anchor="middle">（与人推同一入口，审计在 process 内部）</text>
  <text x="410" y="250" fill="#92400e" font-size="10.5" text-anchor="middle">finally：无论成败放锁</text>
  <line x1="410" y1="262" x2="410" y2="282" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <rect x="210" y="286" width="400" height="56" rx="8" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="410" y="308" fill="#6b21a8" font-size="12.5" font-weight="bold" text-anchor="middle">taskStore.recordExecution</text>
  <text x="410" y="326" fill="#7c3aed" font-size="9.5" text-anchor="middle">成败都记：success / error / duration / next_run_at</text>
  <line x1="410" y1="342" x2="410" y2="362" stroke="#a855f7" stroke-width="2" marker-end="url(#ykpu)"/>
  <rect x="170" y="366" width="480" height="48" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="410" y="386" fill="#15803d" font-size="12.5" font-weight="bold" text-anchor="middle">scheduled_tasks / task_executions 两表可查</text>
  <text x="410" y="404" fill="#166534" font-size="9.5" text-anchor="middle">重启 reconcile 幂等保留 enabled 与 run_count（坑十一）</text>
  <!-- ════════ 右列：三支红色护栏 ════════ -->
  <line x1="610" y1="119" x2="646" y2="119" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd)"/>
  <rect x="650" y="96" width="146" height="52" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="723" y="117" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">停用 → 跳过</text>
  <text x="723" y="135" fill="#b91c1c" font-size="9.5" text-anchor="middle">且不记执行</text>
  <line x1="630" y1="190" x2="646" y2="190" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd)"/>
  <rect x="650" y="162" width="146" height="58" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="723" y="184" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">重叠 → 跳过</text>
  <text x="723" y="202" fill="#b91c1c" font-size="9.5" text-anchor="middle">tryLock 拿不到即跳过</text>
  <text x="723" y="214" fill="#b91c1c" font-size="9.5" text-anchor="middle">不排队堆积</text>
  <line x1="610" y1="314" x2="646" y2="314" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd)"/>
  <rect x="650" y="288" width="146" height="52" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="723" y="309" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">失败不崩</text>
  <text x="723" y="327" fill="#b91c1c" font-size="9.5" text-anchor="middle">异常不外抛 · 照常记失败</text>
  <!-- ════════ 左侧虚线注：钟推会话身份 ════════ -->
  <rect x="24" y="176" width="146" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="97" y="199" fill="#475569" font-size="10.5" font-weight="bold" text-anchor="middle">钟推会话</text>
  <text x="97" y="218" fill="#64748b" font-size="9" text-anchor="middle">scheduler:scheduler:</text>
  <text x="97" y="232" fill="#64748b" font-size="9" text-anchor="middle">agent（三元组单点</text>
  <text x="97" y="246" fill="#64748b" font-size="9" text-anchor="middle">拼接，复用同一 Session）</text>
  <line x1="170" y1="214" x2="186" y2="214" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#yks)"/>
  <!-- ════════ 注脚 ════════ -->
  <text x="410" y="446" fill="#475569" font-size="12" text-anchor="middle">到点 → 查启用 → 抢锁 → 同一入口执行 → 成败都落历史</text>
  <text x="410" y="466" fill="#94a3b8" font-size="10.5" text-anchor="middle">任何一环失败不外抛、不崩调度器（坑二/坑三）；执行链路纯同步，宪法 4 唯一异步例外是调度线程池本身</text>
</svg>
