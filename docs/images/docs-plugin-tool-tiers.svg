<svg viewBox="0 0 820 310" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="310" fill="#ffffff"/>

  <!-- Threshold chips -->
  <rect x="40" y="64" width="230" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="155" y="82" fill="#475569" font-size="11" text-anchor="middle">门槛 · 低</text>
  <rect x="295" y="64" width="230" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="410" y="82" fill="#475569" font-size="11" text-anchor="middle">门槛 · 中</text>
  <rect x="550" y="64" width="230" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="665" y="82" fill="#475569" font-size="11" text-anchor="middle">门槛 · 高</text>

  <!-- Tier 1 (hero) -->
  <rect x="40" y="100" width="230" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="155" y="128" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">方式一 · 零代码 ⭐ 主推</text>
  <text x="155" y="152" fill="#92400e" font-size="10" text-anchor="middle">写 Agent 目录 AGENT.md</text>
  <text x="155" y="170" fill="#92400e" font-size="10" text-anchor="middle">+ 复用社区现成 MCP server</text>
  <text x="155" y="188" fill="#92400e" font-size="10" text-anchor="middle">业务方只描述意图</text>
  <text x="155" y="206" fill="#92400e" font-size="10" text-anchor="middle">LLM 自己组合调用</text>

  <!-- Tier 2 -->
  <rect x="295" y="100" width="230" height="120" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="128" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">方式二 · 轻代码</text>
  <text x="410" y="152" fill="#334155" font-size="10" text-anchor="middle">任何语言写 MCP server</text>
  <text x="410" y="170" fill="#334155" font-size="10" text-anchor="middle">配置在 mcp_servers.yaml</text>
  <text x="410" y="188" fill="#334155" font-size="10" text-anchor="middle">YokeOS 作为 MCP Client 接入</text>
  <text x="410" y="206" fill="#334155" font-size="10" text-anchor="middle">接企业自有系统（ERP / CRM）</text>

  <!-- Tier 3 -->
  <rect x="550" y="100" width="230" height="120" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="665" y="128" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">方式三 · 重代码</text>
  <text x="665" y="152" fill="#334155" font-size="10" text-anchor="middle">Java @Tool 注解 Spring Bean</text>
  <text x="665" y="170" fill="#334155" font-size="10" text-anchor="middle">进程内直接调用 · 不起独立进程</text>
  <text x="665" y="188" fill="#334155" font-size="10" text-anchor="middle">深度集成 · 性能最好</text>
  <text x="665" y="206" fill="#334155" font-size="10" text-anchor="middle">写法与内置 Tool 完全一样</text>

  <!-- Threshold arrow -->
  <line x1="60" y1="252" x2="760" y2="252" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks6)"/>
  <defs>
    <marker id="yks6" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <text x="410" y="274" fill="#64748b" font-size="12" text-anchor="middle">门槛从低到高 —— 选择原则：能用方式一就不用方式二，能用方式二就不用方式三</text>
</svg>
