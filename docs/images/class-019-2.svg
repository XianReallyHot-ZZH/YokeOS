<svg viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="330" fill="#ffffff"/>
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykrd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>

  <!-- ════════ 左：frontmatter 渠道配置（同一 type 两条渠道） ════════ -->
  <rect x="40" y="56" width="240" height="200" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="160" y="78" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">Profile.notify.channels</text>

  <rect x="60" y="94" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="160" y="116" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">name: ops-group</text>
  <text x="160" y="134" fill="#64748b" font-size="9.5" text-anchor="middle">type: webhook → 运维群</text>

  <rect x="60" y="162" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="160" y="184" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">name: dev-group</text>
  <text x="160" y="202" fill="#64748b" font-size="9.5" text-anchor="middle">type: webhook → 开发群</text>

  <text x="160" y="240" fill="#94a3b8" font-size="9.5" text-anchor="middle">同一个 type 可配多条渠道</text>

  <!-- ════════ 中：notify 的渠道解析（本章主角） ════════ -->
  <line x1="280" y1="130" x2="362" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>

  <rect x="370" y="76" width="220" height="140" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="480" y="100" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">notify(content, channel)</text>
  <text x="480" y="126" fill="#92400e" font-size="9.5" text-anchor="middle">缺省 / default → 第一条渠道</text>
  <text x="480" y="146" fill="#92400e" font-size="9.5" text-anchor="middle">显式 name → 精确匹配</text>
  <text x="480" y="166" fill="#92400e" font-size="9.5" text-anchor="middle">匹配不到 → 报错点名</text>
  <text x="480" y="196" fill="#92400e" font-size="9.5" text-anchor="middle">地址从 config 解析，不进对话</text>

  <!-- ════════ 右上：命中路径 / 右下：拒绝路径 ════════ -->
  <line x1="590" y1="106" x2="632" y2="106" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>
  <rect x="640" y="70" width="150" height="56" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="715" y="92" fill="#15803d" font-size="11.5" font-weight="bold" text-anchor="middle">命中的那条渠道</text>
  <text x="715" y="110" fill="#166534" font-size="9.5" text-anchor="middle">url 从 config 解析</text>

  <line x1="590" y1="186" x2="632" y2="186" stroke="#ef4444" stroke-width="1.8" marker-end="url(#ykrd)"/>
  <rect x="640" y="158" width="150" height="56" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="715" y="180" fill="#b91c1c" font-size="11.5" font-weight="bold" text-anchor="middle">点名的 name 不存在</text>
  <text x="715" y="198" fill="#b91c1c" font-size="9.5" text-anchor="middle">失败点名 · 不回退默认</text>

  <!-- ════════ 结论行 ════════ -->
  <text x="410" y="306" fill="#64748b" font-size="12" text-anchor="middle">按 name 匹配：两个 webhook 群无歧义——按 type 匹配分不出 ops-group 与 dev-group（拍板①）</text>
</svg>
