<svg viewBox="0 0 820 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="620" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
  </defs>
  <!-- ════════ 源一：API 创建（indigo） ════════ -->
  <rect x="60" y="24" width="300" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="210" y="50" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">API 创建</text>
  <text x="210" y="70" fill="#6366f1" font-size="10" text-anchor="middle">POST /api/v1/agents {name, agentMarkdown}</text>
  <!-- ════════ 源二：手工丢目录（indigo）→ WorkspaceWatcher（blue） ════════ -->
  <rect x="460" y="24" width="300" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="610" y="50" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">手工丢目录</text>
  <text x="610" y="70" fill="#6366f1" font-size="10" text-anchor="middle">scp / git / 编辑器 → .yokeos/agents/</text>
  <line x1="610" y1="88" x2="610" y2="112" stroke="#6366f1" stroke-width="2" marker-end="url(#yks)"/>
  <rect x="460" y="116" width="300" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="610" y="140" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">WorkspaceWatcher（实时监听）</text>
  <text x="610" y="160" fill="#334155" font-size="9.5" text-anchor="middle">目录级事件；竞态有界延迟重试收敛</text>
  <!-- ════════ 汇流 collector ════════ -->
  <line x1="210" y1="88" x2="210" y2="196" stroke="#94a3b8" stroke-width="2"/>
  <line x1="610" y1="176" x2="610" y2="196" stroke="#3b82f6" stroke-width="2"/>
  <line x1="210" y1="196" x2="610" y2="196" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="196" x2="410" y2="222" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ 主角：唯一注册段（amber） ════════ -->
  <rect x="190" y="226" width="440" height="104" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="252" fill="#b45309" font-size="15" font-weight="bold" text-anchor="middle">AgentLifecycleService.register（唯一注册段）</text>
  <text x="410" y="274" fill="#92400e" font-size="9" text-anchor="middle">deriveProfile 校验 → 防重收口（同名先注销旧定时，FR-016）</text>
  <text x="410" y="292" fill="#92400e" font-size="9" text-anchor="middle">→ ProfileRegistry.register → 有 schedules 挂定时</text>
  <text x="410" y="312" fill="#92400e" font-size="9" text-anchor="middle">API 写完目录与 Watcher 事件都调它——同一段代码</text>
  <!-- ════════ 分叉：注册表（purple）与定时器（blue） ════════ -->
  <line x1="410" y1="330" x2="410" y2="352" stroke="#f59e0b" stroke-width="2"/>
  <line x1="220" y1="352" x2="600" y2="352" stroke="#f59e0b" stroke-width="2"/>
  <line x1="220" y1="352" x2="220" y2="378" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <line x1="600" y1="352" x2="600" y2="378" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <rect x="60" y="382" width="320" height="72" rx="8" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="220" y="408" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">ProfileRegistry（注册表）</text>
  <text x="220" y="428" fill="#7c3aed" font-size="9.5" text-anchor="middle">register / remove / exists——运行时原语（29 节）</text>
  <rect x="440" y="382" width="320" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="408" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">AgentScheduler（定时器）</text>
  <text x="600" y="428" fill="#334155" font-size="10" text-anchor="middle">registerProfile / unregisterProfile</text>
  <text x="600" y="446" fill="#334155" font-size="9.5" text-anchor="middle">29 节运行时原语——到点自己跑</text>
  <!-- ════════ 旁注：启动扫描（虚线 chip，右侧接入主角） ════════ -->
  <rect x="660" y="240" width="136" height="80" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <line x1="660" y1="278" x2="634" y2="278" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="728" y="264" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">启动扫描</text>
  <text x="728" y="282" fill="#64748b" font-size="9" text-anchor="middle">loadAll 既有链路</text>
  <text x="728" y="298" fill="#64748b" font-size="9" text-anchor="middle">不重复登记</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="410" y="496" fill="#475569" font-size="13" font-weight="bold" text-anchor="middle">上传即上线 = 丢目录即上线：两条录入路径殊途同归，全程免重启</text>
  <text x="410" y="520" fill="#94a3b8" font-size="10.5" text-anchor="middle">PUT 更新走显式重注册（先 parse 校验再落盘）——Watcher 听不到子目录内文件改动，不指望事件（坑六）</text>
</svg>
