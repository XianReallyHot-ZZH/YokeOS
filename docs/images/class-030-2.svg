<svg viewBox="0 0 820 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="640" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykgr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="ykrd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
  <!-- ════════ 入口（indigo） ════════ -->
  <rect x="180" y="24" width="300" height="60" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="330" y="50" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">POST /api/v1/agents</text>
  <text x="330" y="70" fill="#6366f1" font-size="10" text-anchor="middle">{name, agentMarkdown}（name 白名单校验在 Controller）</text>
  <!-- ════════ 第一步：冲突拒（红支） ════════ -->
  <line x1="330" y1="84" x2="330" y2="112" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <rect x="180" y="116" width="300" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="330" y="140" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">① name 冲突检查（第一步就拒）</text>
  <text x="330" y="160" fill="#92400e" font-size="10" text-anchor="middle">已存在 → 400，零写入（一个字节不写）</text>
  <line x1="480" y1="146" x2="556" y2="146" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd)"/>
  <rect x="560" y="118" width="220" height="56" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="670" y="140" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">400 Agent 已存在</text>
  <text x="670" y="158" fill="#b91c1c" font-size="9" text-anchor="middle">磁盘无新目录（坑一上半）</text>
  <!-- ════════ 第二步：写目录 ════════ -->
  <line x1="330" y1="176" x2="330" y2="204" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <rect x="180" y="208" width="300" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="330" y="232" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">② AgentStore.write（写目录）</text>
  <text x="330" y="252" fill="#92400e" font-size="10" text-anchor="middle">.yokeos/agents/&lt;name&gt;/AGENT.md 落盘</text>
  <!-- ════════ 第三步：注册（唯一注册段，失败回滚红支） ════════ -->
  <line x1="330" y1="268" x2="330" y2="296" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <rect x="140" y="300" width="380" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="330" y="324" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">③ register（唯一注册段）</text>
  <text x="330" y="344" fill="#92400e" font-size="10" text-anchor="middle">deriveProfile 校验 → 防重注销旧 → registry.register</text>
  <text x="330" y="362" fill="#92400e" font-size="10" text-anchor="middle">→ 有 schedules 则 scheduler.registerProfile</text>
  <text x="330" y="380" fill="#92400e" font-size="9.5" text-anchor="middle">（定义非法 / provider 不存在 → 注册失败）</text>
  <line x1="520" y1="344" x2="556" y2="344" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd)"/>
  <rect x="560" y="300" width="220" height="88" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="670" y="324" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">注册失败 → 回滚</text>
  <text x="670" y="344" fill="#b91c1c" font-size="9.5" text-anchor="middle">AgentStore.delete 已写目录</text>
  <text x="670" y="360" fill="#b91c1c" font-size="9.5" text-anchor="middle">定时 never——不留半个 Agent</text>
  <text x="670" y="378" fill="#b91c1c" font-size="9" text-anchor="middle">400 可读原因（坑一下半）</text>
  <!-- ════════ 成功出口（绿） ════════ -->
  <line x1="330" y1="388" x2="330" y2="416" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykgr)"/>
  <rect x="180" y="420" width="300" height="72" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="330" y="446" fill="#15803d" font-size="14" font-weight="bold" text-anchor="middle">200 OK——不重启即上线</text>
  <text x="330" y="466" fill="#166534" font-size="10" text-anchor="middle">GET /api/v1/agents 立刻可见；有 cron 到点自己跑</text>
  <text x="330" y="482" fill="#166534" font-size="9.5" text-anchor="middle">（Watcher 事件走的也是 ②③ 同一段 register）</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="410" y="540" fill="#475569" font-size="13" font-weight="bold" text-anchor="middle">系统里只有「完整的 Agent」或「没有这个 Agent」两种状态</text>
  <text x="410" y="564" fill="#94a3b8" font-size="10.5" text-anchor="middle">PUT 同段复用：先 parse 字符串校验（非法不落盘、旧定义不破坏）→ write → register（analyze H1 改序）</text>
</svg>
