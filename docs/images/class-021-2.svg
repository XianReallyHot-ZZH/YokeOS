<svg viewBox="0 0 820 358" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="358" fill="#ffffff"/>
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <!-- ════════ 主上下文 = 内存 ════════ -->
  <rect x="70" y="36" width="480" height="124" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="90" y="58" fill="#475569" font-size="11" font-weight="bold">主上下文 · 相当于内存（快、贵、有限）</text>

  <rect x="100" y="72" width="200" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="96" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">核心记忆 core memory</text>
  <text x="200" y="116" fill="#92400e" font-size="9.5" text-anchor="middle">小而恒定 · 永远在场不换出</text>

  <rect x="330" y="72" width="190" height="64" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="425" y="96" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">当前对话历史</text>
  <text x="425" y="116" fill="#334155" font-size="9.5" text-anchor="middle">随会话变化 · 挤了就得整理</text>

  <!-- ════════ 换入 / 换出 ════════ -->
  <line x1="280" y1="200" x2="280" y2="166" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>
  <text x="268" y="188" fill="#475569" font-size="10" text-anchor="end">检索换入</text>
  <line x1="360" y1="160" x2="360" y2="194" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>
  <text x="372" y="188" fill="#475569" font-size="10">归档换出</text>

  <!-- ════════ 外部上下文 = 磁盘 ════════ -->
  <rect x="70" y="200" width="480" height="96" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="90" y="222" fill="#475569" font-size="11" font-weight="bold">外部上下文 · 相当于磁盘（慢、便宜、近乎无限）</text>

  <rect x="100" y="236" width="420" height="48" rx="8" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="310" y="256" fill="#6b21a8" font-size="12" font-weight="bold" text-anchor="middle">归档记忆 archival + 完整历史</text>
  <text x="310" y="274" fill="#7c3aed" font-size="9.5" text-anchor="middle">模型看不见——必须检索调回才能用</text>

  <!-- ════════ 右侧旁注：YokeOS 的取舍 ════════ -->
  <rect x="600" y="72" width="190" height="180" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="695" y="96" fill="#475569" font-size="10.5" font-weight="bold" text-anchor="middle">YokeOS 的取舍</text>
  <text x="695" y="120" fill="#64748b" font-size="9.5" text-anchor="middle">① 吸收：核心/归档两分区</text>
  <text x="695" y="144" fill="#64748b" font-size="9.5" text-anchor="middle">② 记忆操作交给 Agent</text>
  <text x="695" y="166" fill="#64748b" font-size="9.5" text-anchor="middle">（save / recall 主动调）</text>
  <text x="695" y="190" fill="#64748b" font-size="9.5" text-anchor="middle">③ 压力触发自动整理</text>
  <text x="695" y="212" fill="#64748b" font-size="9.5" text-anchor="middle">→ 扩展阶段候选（信号驱动）</text>

  <!-- ════════ 结论行 ════════ -->
  <text x="410" y="334" fill="#64748b" font-size="10.5" text-anchor="middle">MemGPT 用虚拟内存的思路管上下文——YokeOS 吸收分层，自动整理等真实信号</text>
</svg>
