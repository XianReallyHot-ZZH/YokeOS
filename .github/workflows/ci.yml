name: CI

on:
  push:
    branches: [master, 'specs/**']
    paths-ignore:
      - 'website/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 最小权限：本 workflow 只需要读仓库。
permissions:
  contents: read

# 每个 PR / 分支一次运行；同分支新推送自动取消旧运行，省 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 全量质量门禁：spotless → checkstyle → compile → test → pmd/p3c →
      # spotbugs+findsecbugs。任何违规即 job 失败。
      - name: mvn verify
        run: mvn -B clean verify

  dependency-check:
    name: OWASP Dependency-Check (CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # 上传 artifact 报告
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 只打包（跳过 build job 已覆盖的质量插件），再跑 Dependency-Check aggregate——
      # CVE 失败一眼可辨。NVD 数据走 Dependency-Check 夜间缓存（无需 API key）。
      - name: package (skip quality plugins)
        run: >-
          mvn -B clean package -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
      - name: OWASP dependency-check aggregate
        run: mvn -B -Dowasp.skip=false org.owasp:dependency-check-maven:aggregate
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: ignore
