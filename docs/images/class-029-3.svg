<svg viewBox="0 0 820 578" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="578" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>
  <!-- ════════ 两条来源（现在 + 30 节未来） ════════ -->
  <rect x="60" y="24" width="300" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="210" y="50" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">启动扫描（装配层）</text>
  <text x="210" y="70" fill="#6366f1" font-size="10" text-anchor="middle">YokeosRuntime：loadAll(agents/)</text>
  <rect x="460" y="24" width="300" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="610" y="50" fill="#475569" font-size="14" font-weight="bold" text-anchor="middle">运行期新增（30 节）</text>
  <text x="610" y="70" fill="#64748b" font-size="10" text-anchor="middle">POST /api/v1/agents · WorkspaceWatcher</text>
  <!-- ════════ 汇流 collector ════════ -->
  <line x1="210" y1="88" x2="210" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <line x1="610" y1="88" x2="610" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <line x1="210" y1="118" x2="610" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="118" x2="410" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ 主角：同一段注册代码（amber） ════════ -->
  <rect x="210" y="150" width="400" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="178" fill="#b45309" font-size="15" font-weight="bold" text-anchor="middle">同一段注册代码（同一套校验）</text>
  <text x="410" y="200" fill="#92400e" font-size="9.5" text-anchor="middle">deriveProfile(frontmatter) → ProfileRegistry.register → AgentScheduler.registerProfile</text>
  <text x="410" y="222" fill="#92400e" font-size="9.5" text-anchor="middle">启动扫描与运行期新增（30 节）都走这条路——「两条来源同规矩」</text>
  <!-- ════════ 分叉：两处运行时原语（本节增量） ════════ -->
  <line x1="410" y1="246" x2="410" y2="268" stroke="#f59e0b" stroke-width="2"/>
  <line x1="220" y1="268" x2="600" y2="268" stroke="#f59e0b" stroke-width="2"/>
  <line x1="220" y1="268" x2="220" y2="296" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <line x1="600" y1="268" x2="600" y2="296" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <rect x="60" y="300" width="320" height="76" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="324" fill="#1d4ed8" font-size="12.5" font-weight="bold" text-anchor="middle">ProfileRegistry ＋ 本节补 exists / remove</text>
  <text x="220" y="344" fill="#334155" font-size="9.5" text-anchor="middle">remove 幂等（重复 false）· 同名后到覆盖（29 节定夺）</text>
  <text x="220" y="362" fill="#334155" font-size="9" text-anchor="middle">register / get / all（16 节已有）</text>
  <rect x="440" y="300" width="320" height="76" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="324" fill="#1d4ed8" font-size="12.5" font-weight="bold" text-anchor="middle">AgentScheduler ＋ 本节补 unregisterProfile</text>
  <text x="600" y="344" fill="#334155" font-size="9.5" text-anchor="middle">cancel(false) 不打断执行中 · taskId 同源派生</text>
  <text x="600" y="362" fill="#334155" font-size="9" text-anchor="middle">registerProfile ＋ 句柄表（25 节已有）</text>
  <!-- ════════ 汇流 → 30 节消费（虚线未来） ════════ -->
  <line x1="220" y1="376" x2="220" y2="400" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="600" y1="376" x2="600" y2="400" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="220" y1="400" x2="600" y2="400" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="410" y1="400" x2="410" y2="426" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#yks)"/>
  <rect x="60" y="430" width="700" height="75" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="410" y="454" fill="#475569" font-size="12" font-weight="bold" text-anchor="middle">30 节消费（AgentLifecycleService 编排）</text>
  <text x="410" y="474" fill="#64748b" font-size="9.5" text-anchor="middle">PUT /agents/{name} = 覆盖式 register；schedules 变更先 unregisterProfile 再 registerProfile</text>
  <text x="410" y="492" fill="#64748b" font-size="9.5" text-anchor="middle">DELETE /agents/{name} = 注销定时 → remove 出索引 → 归档 .yokeos/archive/</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="410" y="536" fill="#475569" font-size="10.5" text-anchor="middle">运行时注册第一阶段就立好：目录就位即上线、删除即下线，全程免重启（技 §11.2）</text>
  <text x="410" y="554" fill="#94a3b8" font-size="9.5" text-anchor="middle">编排职责（先定时后索引后归档）归 30 节——本节只立原语，不抢做联动</text>
</svg>
