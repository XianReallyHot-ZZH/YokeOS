<svg viewBox="0 0 820 415" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="415" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykgr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
    <marker id="ykrd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
  <!-- ════════ 入口：业务系统请求 ════════ -->
  <rect x="110" y="24" width="600" height="50" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="410" y="45" fill="#4338ca" font-size="15" font-weight="bold" text-anchor="middle">业务系统 · POST /api/v1/sessions/{id}/messages</text>
  <text x="410" y="64" fill="#6366f1" font-size="10.5" text-anchor="middle">JSON body · 单条消息 ≤ 32KB</text>
  <line x1="410" y1="74" x2="410" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ 主角：Controller 薄壳 ════════ -->
  <rect x="110" y="102" width="440" height="54" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="330" y="126" fill="#b45309" font-size="15" font-weight="bold" text-anchor="middle">SessionApiController（薄壳）</text>
  <text x="330" y="146" fill="#92400e" font-size="10.5" text-anchor="middle">校验（空 / 超 32KB → 400）· 查会话（未命中 → 404）· 转交后包装</text>
  <!-- ════════ 异常列举 1：校验 / 资源层 ════════ -->
  <line x1="550" y1="129" x2="586" y2="129" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd)"/>
  <rect x="590" y="102" width="190" height="54" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="685" y="120" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">校验 / 资源异常</text>
  <text x="685" y="136" fill="#b91c1c" font-size="8.5" text-anchor="middle">IllegalArgumentException</text>
  <text x="685" y="149" fill="#b91c1c" font-size="8.5" text-anchor="middle">SessionNotFoundException</text>
  <!-- ════════ 引擎：AgentService ════════ -->
  <line x1="410" y1="156" x2="410" y2="182" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <rect x="110" y="184" width="440" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="330" y="208" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">AgentService.process(session, content)</text>
  <text x="330" y="228" fill="#334155" font-size="10.5" text-anchor="middle">与 yokeos chat 同一入口 · ReAct · 记忆注入 · 审计两表随行</text>
  <!-- ════════ 异常列举 2：引擎 / Provider 层 ════════ -->
  <line x1="550" y1="211" x2="586" y2="211" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd)"/>
  <rect x="590" y="184" width="190" height="54" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="685" y="202" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">引擎 / Provider 异常</text>
  <text x="685" y="218" fill="#b91c1c" font-size="8.5" text-anchor="middle">IllegalStateException(503)</text>
  <text x="685" y="231" fill="#b91c1c" font-size="8.5" text-anchor="middle">AgentTimeoutException(504)</text>
  <!-- ════════ 异常层层下汇：GlobalExceptionHandler ════════ -->
  <line x1="685" y1="156" x2="685" y2="182" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd)"/>
  <line x1="685" y1="238" x2="685" y2="286" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd)"/>
  <rect x="590" y="288" width="190" height="58" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="685" y="310" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">GlobalExceptionHandler</text>
  <text x="685" y="326" fill="#b91c1c" font-size="8.5" text-anchor="middle">统一异常单出口</text>
  <text x="685" y="339" fill="#b91c1c" font-size="8.5" text-anchor="middle">500 兜底不泄漏细节</text>
  <!-- ════════ 成功路径与信封 ════════ -->
  <line x1="410" y1="238" x2="410" y2="286" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <rect x="110" y="288" width="440" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="330" y="311" fill="#15803d" font-size="14" font-weight="bold" text-anchor="middle">统一信封 ApiResponse</text>
  <text x="330" y="331" fill="#166534" font-size="10.5" text-anchor="middle">{ code, message, data, timestamp } · 成功与错误共用</text>
  <!-- ════════ 错误也进同一信封 ════════ -->
  <line x1="590" y1="317" x2="554" y2="317" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd)"/>
  <!-- ════════ 注脚 ════════ -->
  <text x="410" y="376" fill="#475569" font-size="12" text-anchor="middle">Controller 只做校验与转交、引擎同一、异常单出口——500 兜底只回固定话术，细节进日志</text>
  <text x="410" y="395" fill="#94a3b8" font-size="10.5" text-anchor="middle">错误码口径：400 参数 · 404 资源 · 500 内部 · 503 Provider · 504 超时（60s 由 provider 层承载）</text>
</svg>
