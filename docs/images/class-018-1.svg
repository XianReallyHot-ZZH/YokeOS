<svg viewBox="0 0 880 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
    <marker id="ykgr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="ykrd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
  <!-- ════════ 两个人推入口（并列 indigo） ════════ -->
  <rect x="120" y="24" width="280" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="260" y="48" fill="#4338ca" font-size="15" font-weight="bold" text-anchor="middle">CLI · yokeos chat</text>
  <text x="260" y="68" fill="#6366f1" font-size="12" text-anchor="middle">本地交互 · 开发调试（本节交付）</text>
  <rect x="480" y="24" width="280" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="620" y="48" fill="#4338ca" font-size="15" font-weight="bold" text-anchor="middle">Web Service · yokeos serve</text>
  <text x="620" y="68" fill="#6366f1" font-size="12" text-anchor="middle">业务系统集成 · REST（26 节）</text>
  <!-- ════════ 汇流 collector：两竖一横一竖出 ════════ -->
  <line x1="260" y1="88" x2="260" y2="116" stroke="#94a3b8" stroke-width="2"/>
  <line x1="620" y1="88" x2="620" y2="116" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="116" x2="620" y2="116" stroke="#94a3b8" stroke-width="2"/>
  <line x1="440" y1="116" x2="440" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ 主角：统一入口（amber） ════════ -->
  <rect x="240" y="148" width="400" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="440" y="172" fill="#b45309" font-size="15" font-weight="bold" text-anchor="middle">AgentService.process —— 统一入口</text>
  <text x="440" y="192" fill="#92400e" font-size="11.5" text-anchor="middle">查 Profile → 跑循环 → 存会话（17 节交付）</text>
  <!-- ════════ 旁注：钟推留位（虚线） ════════ -->
  <rect x="696" y="154" width="160" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="776" y="176" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">钟推 · AgentScheduler</text>
  <text x="776" y="194" fill="#64748b" font-size="9.5" text-anchor="middle">第三触发源（25 节）</text>
  <line x1="696" y1="180" x2="644" y2="180" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#yks)"/>
  <!-- ════════ 引擎（blue） ════════ -->
  <line x1="440" y1="212" x2="440" y2="252" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <rect x="240" y="256" width="400" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="280" fill="#1d4ed8" font-size="15" font-weight="bold" text-anchor="middle">ReAct 引擎（16 / 17 节）</text>
  <text x="440" y="300" fill="#334155" font-size="11.5" text-anchor="middle">Provider 调模型 · ToolExecutor 执行工具</text>
  <!-- ════════ 共享存储（purple） ════════ -->
  <line x1="440" y1="320" x2="440" y2="356" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <rect x="180" y="360" width="520" height="64" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="440" y="384" fill="#6b21a8" font-size="14.5" font-weight="bold" text-anchor="middle">SQLite · sessions / llm_calls / tool_invocations</text>
  <text x="440" y="404" fill="#7c3aed" font-size="11.5" text-anchor="middle">三种运行模式共享同一套 Session 存储与 Agent 配置</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="440" y="442" fill="#475569" font-size="11" text-anchor="middle">两个「人推」入口 + 一个「钟推」留位：消息从哪进来不同，引擎与存储是同一套</text>
  <text x="440" y="460" fill="#94a3b8" font-size="10" text-anchor="middle">CLI 管本地交互调试，Web Service 管业务系统集成（需 §5.9 / 技 §8.6）</text>
</svg>
