<svg viewBox="0 0 860 396" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="860" height="396" fill="#ffffff"/>
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <!-- ════════ 三种来源（并列实例） ════════ -->
  <rect x="70" y="36" width="220" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="60" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">内置 @Tool Bean</text>
  <text x="180" y="80" fill="#334155" font-size="9.5" text-anchor="middle">File / Shell / Http 三组</text>
  <text x="180" y="98" fill="#334155" font-size="9.5" text-anchor="middle">NotifyTools 直接实现 YokeTool</text>

  <rect x="320" y="36" width="220" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="60" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">业务 @Tool Bean</text>
  <text x="430" y="80" fill="#334155" font-size="9.5" text-anchor="middle">扩展方式三 · 写法与内置一样</text>
  <text x="430" y="98" fill="#334155" font-size="9.5" text-anchor="middle">进程内直调（宪法 2 边界）</text>

  <rect x="570" y="36" width="220" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="680" y="60" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">MCP server 工具</text>
  <text x="680" y="80" fill="#334155" font-size="9.5" text-anchor="middle">tools/list → McpToolAdapter</text>
  <text x="680" y="98" fill="#334155" font-size="9.5" text-anchor="middle">外部进程 · stdio transport</text>

  <!-- ════════ 汇流 collector：三源 → Registry ════════ -->
  <line x1="180" y1="112" x2="180" y2="140" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="430" y1="112" x2="430" y2="140" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="680" y1="112" x2="680" y2="140" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="180" y1="140" x2="680" y2="140" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="430" y1="140" x2="430" y2="158" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>

  <!-- ════════ ToolRegistry（本章主角：汇合点） ════════ -->
  <rect x="280" y="164" width="300" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="430" y="188" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">ToolRegistry</text>
  <text x="430" y="208" fill="#92400e" font-size="9.5" text-anchor="middle">三种来源统一成 YokeTool · 重名注册拒绝</text>

  <!-- ════════ 一分二 collector：Registry → 两个消费方 ════════ -->
  <line x1="430" y1="224" x2="430" y2="252" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="280" y1="252" x2="580" y2="252" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="280" y1="252" x2="280" y2="272" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>
  <line x1="580" y1="252" x2="580" y2="272" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>

  <!-- ════════ 消费方（只认 YokeTool） ════════ -->
  <rect x="170" y="278" width="220" height="60" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="280" y="300" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">PromptBuilder</text>
  <text x="280" y="320" fill="#6366f1" font-size="9.5" text-anchor="middle">按 Profile.tools 点名过滤</text>

  <rect x="470" y="278" width="220" height="60" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="580" y="300" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">ToolExecutor</text>
  <text x="580" y="320" fill="#6366f1" font-size="9.5" text-anchor="middle">解析 → 执行 → 审计 tool_invocations</text>

  <!-- ════════ 结论行 ════════ -->
  <text x="430" y="372" fill="#64748b" font-size="12" text-anchor="middle">ReAct 循环只认 Map 里的 YokeTool，不感知工具从哪来——加工具的成本恒定在写一个类</text>
</svg>
