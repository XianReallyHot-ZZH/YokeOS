<svg viewBox="0 0 880 408" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="880" height="408" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <!-- ════════ 左栏：ReActLoop 只做调度（amber 主角） ════════ -->
  <rect x="40" y="64" width="380" height="158" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="60" y="94" fill="#b45309" font-size="16" font-weight="bold">ReActLoop 只做调度</text>
  <text x="60" y="124" fill="#92400e" font-size="12.5">· 转圈——直到判停或转满轮数</text>
  <text x="60" y="150" fill="#92400e" font-size="12.5">· 判断该不该停（有无工具调用）</text>
  <text x="60" y="176" fill="#92400e" font-size="12.5">· 把每轮结果攒进 Session</text>
  <text x="60" y="202" fill="#92400e" font-size="12.5">· 核心数十行，自己实现（宪法 1）</text>
  <!-- ════════ 右栏：其余全部交出去（blue 子组件） ════════ -->
  <rect x="460" y="64" width="380" height="158" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="94" fill="#1d4ed8" font-size="16" font-weight="bold">其余全部交出去</text>
  <text x="480" y="124" fill="#334155" font-size="12.5">· 拼每轮上下文 → PromptBuilder</text>
  <text x="480" y="150" fill="#334155" font-size="12.5">· 调 LLM → ProviderService（core 接口）</text>
  <text x="480" y="176" fill="#334155" font-size="12.5">· 执行工具 → ToolExecutor</text>
  <text x="480" y="202" fill="#334155" font-size="12.5">· 编排 + ProfileContext → AgentService</text>
  <!-- 中间交接箭头 -->
  <line x1="420" y1="143" x2="456" y2="143" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <text x="438" y="134" fill="#64748b" font-size="9.5" text-anchor="middle">交出去</text>
  <!-- ════════ 坑带：五个坑，设计时定死 ════════ -->
  <text x="40" y="254" fill="#475569" font-size="11.5" font-weight="bold">五个坑——设计时定死，每个坑一个回归测试钉住</text>
  <rect x="40" y="266" width="148" height="68" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="114" y="292" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">坑一 · 死循环兜底</text>
  <text x="114" y="310" fill="#64748b" font-size="9" text-anchor="middle">转满最大轮数强制停</text>
  <rect x="202" y="266" width="148" height="68" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="276" y="292" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">坑二 · 上下文截断</text>
  <text x="276" y="310" fill="#64748b" font-size="9" text-anchor="middle">超 N 轮按轮界截断</text>
  <rect x="364" y="266" width="148" height="68" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="438" y="292" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">坑三 · 累积留痕</text>
  <text x="438" y="310" fill="#64748b" font-size="9" text-anchor="middle">每轮都进 Session</text>
  <rect x="526" y="266" width="148" height="68" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="600" y="292" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">坑四 · ThreadLocal</text>
  <text x="600" y="310" fill="#64748b" font-size="9" text-anchor="middle">异常也清 ProfileContext</text>
  <rect x="688" y="266" width="148" height="68" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="762" y="292" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">坑五 · 唯一执行路径</text>
  <text x="762" y="310" fill="#64748b" font-size="9" text-anchor="middle">自动执行保持关闭</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="440" y="368" fill="#475569" font-size="11" text-anchor="middle">循环越薄越好读、越不容易出 bug——坑不是写完再补，是设计时定死</text>
  <text x="440" y="386" fill="#94a3b8" font-size="10" text-anchor="middle">宪法 1/2：自实现 ReAct 循环；工具执行权只在 ToolExecutor 一处</text>
</svg>
