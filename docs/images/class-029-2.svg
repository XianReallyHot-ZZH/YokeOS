<svg viewBox="0 0 820 616" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="616" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykgr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="ykpu" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/></marker>
  </defs>
  <!-- ════════ 主角：system prompt 组装容器（amber） ════════ -->
  <rect x="40" y="24" width="460" height="400" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="270" y="52" fill="#b45309" font-size="16" font-weight="bold" text-anchor="middle">system prompt</text>
  <text x="270" y="70" fill="#92400e" font-size="11" text-anchor="middle">ContextLoader 每次现取 · 零缓存 · 改完即时生效</text>
  <!-- 段① identity -->
  <rect x="70" y="88" width="400" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="270" y="112" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">① identity.prompt</text>
  <text x="270" y="132" fill="#334155" font-size="10" text-anchor="middle">人格与系统提示词（frontmatter identity 段）</text>
  <!-- 段② Bootstrap -->
  <rect x="70" y="160" width="400" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="270" y="184" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">② Bootstrap</text>
  <text x="270" y="204" fill="#334155" font-size="10" text-anchor="middle">AGENTS.md → SOUL.md → USER.md（固定相对序）</text>
  <!-- 段③ 点名 Skill 正文（本节接线，amber 高亮） -->
  <rect x="70" y="232" width="400" height="74" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="270" y="256" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">③ 点名 Skill 正文（29 节接线）</text>
  <text x="270" y="275" fill="#92400e" font-size="10" text-anchor="middle">## 技能（名）+ 剥 frontmatter 的正文 · 按声明序</text>
  <text x="270" y="294" fill="#92400e" font-size="9.5" text-anchor="middle">点名不存在 → WARN 有痕跳过</text>
  <!-- 段④ AGENT.md 正文 -->
  <rect x="70" y="318" width="400" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="270" y="342" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">④ AGENT.md 正文（压轴）</text>
  <text x="270" y="362" fill="#334155" font-size="10" text-anchor="middle">任务指令——压得住前面的规范</text>
  <text x="88" y="410" fill="#b91c1c" font-size="9.5" text-anchor="start">× REFERENCE.md / scripts/ 不预载、不进 system prompt</text>
  <!-- ════════ 公共 Skill 库 → 段③ 实线注入 ════════ -->
  <rect x="556" y="24" width="224" height="100" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="668" y="50" fill="#6b21a8" font-size="13.5" font-weight="bold" text-anchor="middle">公共 Skill 库</text>
  <text x="668" y="70" fill="#7c3aed" font-size="10" text-anchor="middle">skills/report-format/SKILL.md</text>
  <text x="668" y="90" fill="#7c3aed" font-size="9.5" text-anchor="middle">agentskills.io 兼容 · 跨 Agent 共享</text>
  <path d="M556,74 L514,74 L514,269 L506,269" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#ykpu)"/>
  <text x="668" y="146" fill="#6b21a8" font-size="10" font-weight="bold" text-anchor="middle">点名即整段注入</text>
  <text x="668" y="162" fill="#7c3aed" font-size="9" text-anchor="middle">frontmatter skills: 按名引用</text>
  <!-- ════════ 附属资源（虚线旁注，不进 prompt） ════════ -->
  <rect x="556" y="190" width="224" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="668" y="216" fill="#475569" font-size="12" font-weight="bold" text-anchor="middle">REFERENCE.md（参考）</text>
  <text x="668" y="236" fill="#64748b" font-size="9.5" text-anchor="middle">字段字典 · 已知可接受差异</text>
  <rect x="556" y="296" width="224" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="668" y="322" fill="#475569" font-size="12" font-weight="bold" text-anchor="middle">scripts/reconcile.py</text>
  <text x="668" y="342" fill="#64748b" font-size="9.5" text-anchor="middle">确定性抓数 · 输出差异 JSON</text>
  <!-- ════════ 汇流 → 按需进对话（green） ════════ -->
  <path d="M556,222 L538,222 L538,478" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,3"/>
  <path d="M556,328 L538,328" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,3"/>
  <path d="M538,478 L538,482" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#yks)"/>
  <rect x="40" y="486" width="740" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="410" y="508" fill="#15803d" font-size="12.5" font-weight="bold" text-anchor="middle">按需进对话（不是 system prompt）</text>
  <text x="410" y="528" fill="#166534" font-size="10" text-anchor="middle">运行时模型自己调：read_file 读参考 · shell 跑脚本——脚本只有产出进上下文、代码不进</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="410" y="574" fill="#475569" font-size="10.5" text-anchor="middle">常驻层最小化：AGENT.md 正文 + 点名 Skill；渐进式披露第一阶段 = 整段注入，按需披露放扩展阶段</text>
  <text x="410" y="592" fill="#94a3b8" font-size="9.5" text-anchor="middle">Skill 不进 ToolRegistry（宪法 8）· 附属资源经既有工具按需取用 · 没有新工具</text>
</svg>
