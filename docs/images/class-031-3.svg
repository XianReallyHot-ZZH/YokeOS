<svg viewBox="0 0 820 730" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="730" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
  </defs>
  <!-- ════════ 钟推入口（indigo） ════════ -->
  <rect x="180" y="24" width="460" height="56" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="410" y="48" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">钟推触发 · AgentScheduler</text>
  <text x="410" y="68" fill="#6366f1" font-size="10" text-anchor="middle">cron 0 0 9 * * *（id: digest-morning）· 无人触发</text>
  <line x1="410" y1="80" x2="410" y2="104" stroke="#6366f1" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ 主角：同一条执行链（amber） ════════ -->
  <rect x="180" y="108" width="460" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="132" fill="#b45309" font-size="15" font-weight="bold" text-anchor="middle">AgentService.process——同一条执行链</text>
  <text x="410" y="152" fill="#92400e" font-size="9.5" text-anchor="middle">人推补跑：POST /agents/daily-tech-digest/invoke</text>
  <line x1="410" y1="172" x2="410" y2="196" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <!-- ════════ 三源注入 system prompt（blue） ════════ -->
  <rect x="180" y="200" width="460" height="88" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="224" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">PromptBuilder 组装 system prompt——三源注入</text>
  <text x="410" y="244" fill="#334155" font-size="9.5" text-anchor="middle">AGENT.md 正文（任务指令）</text>
  <text x="410" y="262" fill="#334155" font-size="9.5" text-anchor="middle">digest-format Skill 正文（按名引用注入，非 read_file）</text>
  <text x="410" y="280" fill="#334155" font-size="9.5" text-anchor="middle">MEMORY.md 偏好「更关注 AI 和芯片」（22 节机制）</text>
  <text x="168" y="306" fill="#64748b" font-size="9.5" text-anchor="end">LLM 自主决策</text>
  <line x1="410" y1="288" x2="410" y2="312" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <!-- ════════ DeepSeek 决定调新闻工具（blue） ════════ -->
  <rect x="180" y="316" width="460" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="340" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">DeepSeek 决定调新闻工具——llm_calls 落账</text>
  <text x="410" y="360" fill="#334155" font-size="9.5" text-anchor="middle">选哪条路、怎么组稿都是模型的事——YokeOS 不解析任务步骤</text>
  <line x1="290" y1="380" x2="290" y2="394" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <line x1="530" y1="380" x2="530" y2="394" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <!-- ════════ 外部双路：news-mcp 与 http_get 兜底（green） ════════ -->
  <rect x="180" y="400" width="220" height="64" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="290" y="424" fill="#15803d" font-size="12.5" font-weight="bold" text-anchor="middle">news-mcp 子进程（stdio）</text>
  <text x="290" y="444" fill="#166534" font-size="9" text-anchor="middle">fetch_tech_news——HN Algolia 免 key</text>
  <rect x="420" y="400" width="220" height="64" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="530" y="424" fill="#15803d" font-size="12.5" font-weight="bold" text-anchor="middle">http_get 兜底 · hn.algolia</text>
  <text x="530" y="444" fill="#166534" font-size="9" text-anchor="middle">MCP 哑了 Demo 不哑</text>
  <line x1="290" y1="464" x2="290" y2="480" stroke="#94a3b8" stroke-width="2"/>
  <line x1="530" y1="464" x2="530" y2="480" stroke="#94a3b8" stroke-width="2"/>
  <line x1="290" y1="480" x2="530" y2="480" stroke="#94a3b8" stroke-width="2"/>
  <text x="168" y="486" fill="#64748b" font-size="9.5" text-anchor="end">新闻条目回填</text>
  <text x="168" y="500" fill="#64748b" font-size="9.5" text-anchor="end">对话历史</text>
  <line x1="410" y1="480" x2="410" y2="490" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ 组稿（blue） ════════ -->
  <rect x="180" y="496" width="460" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="520" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">组稿——严格按 Skill 组稿规范</text>
  <text x="410" y="540" fill="#334155" font-size="9.5" text-anchor="middle">偏好条目 ★ 标记排在最前——能力三跨天生效的直接证据</text>
  <line x1="410" y1="560" x2="410" y2="584" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <!-- ════════ 外部：webhook 收件（green） ════════ -->
  <rect x="180" y="588" width="460" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="410" y="612" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">notify → webhook.site / 企业 IM</text>
  <text x="410" y="632" fill="#166534" font-size="10" text-anchor="middle">收到带 ★ 偏好标记的科技日报</text>
  <!-- ════════ 旁注：审计三表（purple，虚线接入） ════════ -->
  <rect x="664" y="312" width="132" height="130" rx="6" fill="#ede9fe" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="5,3"/>
  <line x1="640" y1="348" x2="664" y2="348" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="730" y="336" fill="#6b21a8" font-size="11.5" font-weight="bold" text-anchor="middle">审计三表</text>
  <text x="730" y="352" fill="#6b21a8" font-size="11.5" font-weight="bold" text-anchor="middle">day one</text>
  <text x="730" y="372" fill="#7c3aed" font-size="9" text-anchor="middle">tool_invocations</text>
  <text x="730" y="388" fill="#7c3aed" font-size="9" text-anchor="middle">（MCP 工具、notify）</text>
  <text x="730" y="404" fill="#7c3aed" font-size="9" text-anchor="middle">llm_calls 每轮一条</text>
  <text x="730" y="420" fill="#7c3aed" font-size="9" text-anchor="middle">scheduled_tasks 记账</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="410" y="682" fill="#475569" font-size="13" font-weight="bold" text-anchor="middle">业务方全程零 Java——只写 AGENT.md + 公共 SKILL.md + mcp_servers.yaml，LLM 自己拉新闻、组稿、推送</text>
  <text x="410" y="704" fill="#94a3b8" font-size="10.5" text-anchor="middle">Skill 正文注入 system prompt（宪法 8 按名引用，与参照 read_file 按需读形态不同）；种记忆经 save_memory 落 MEMORY.md</text>
</svg>
