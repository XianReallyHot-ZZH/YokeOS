<svg viewBox="0 0 820 456" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="456" fill="#ffffff"/>
  <defs>
    <marker id="yks8" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykgr8" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
  </defs>

  <!-- LLM call -->
  <rect x="250" y="24" width="320" height="54" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="410" y="48" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">LLM 调 notify(content, channel)</text>
  <text x="410" y="68" fill="#6366f1" font-size="11" text-anchor="middle">不接触 webhook 地址 —— 地址是运行时配置，不是对话里的信息</text>

  <line x1="410" y1="78" x2="410" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks8)"/>

  <!-- NotifyTools (hero) -->
  <rect x="185" y="102" width="450" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="128" fill="#b45309" font-size="15" font-weight="bold" text-anchor="middle">NotifyTools（内置 Tool）</text>
  <text x="410" y="148" fill="#92400e" font-size="11" text-anchor="middle">从 ProfileContext 取当前 Agent 的 frontmatter notify.channels，解析适配器和 URL</text>

  <line x1="410" y1="160" x2="410" y2="188" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks8)"/>

  <!-- Adapter interface -->
  <rect x="185" y="190" width="450" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="212" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">NotifyChannelAdapter 接口（接口先行）</text>
  <text x="410" y="230" fill="#334155" font-size="10" text-anchor="middle">send(NotifyTarget, content) · 不携带具体渠道细节</text>

  <line x1="410" y1="238" x2="410" y2="268" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks8)"/>

  <!-- Implementation -->
  <rect x="185" y="270" width="450" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="292" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">WebhookNotifyAdapter（第一阶段唯一实现）</text>
  <text x="410" y="310" fill="#334155" font-size="10" text-anchor="middle">企业微信 · 飞书 · 钉钉 · Slack 群机器人（约定 JSON 格式 POST）</text>

  <line x1="410" y1="318" x2="410" y2="348" stroke="#22c55e" stroke-width="2" marker-end="url(#ykgr8)"/>

  <!-- Target -->
  <rect x="185" y="350" width="450" height="48" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="410" y="372" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">企业 IM 群</text>
  <text x="410" y="390" fill="#166534" font-size="10" text-anchor="middle">Agent 跑完把结果送到人能看到的地方</text>

  <!-- Sandbox note -->
  <rect x="680" y="270" width="130" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="745" y="290" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">Sandbox.enforce</text>
  <text x="745" y="305" fill="#64748b" font-size="9" text-anchor="middle">HTTP_REQUEST · url</text>
  <text x="745" y="319" fill="#64748b" font-size="9" text-anchor="middle">复用域名白名单</text>
  <line x1="680" y1="298" x2="639" y2="298" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#yks8)"/>

  <!-- Bottom note -->
  <text x="410" y="436" fill="#64748b" font-size="12" text-anchor="middle">推送成功失败都写 tool_invocations · 入站 Channel 与出站 Notify 语义相反，分开建模不合并</text>
</svg>
