<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="icon-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#16223D"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <!-- Dark backdrop -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#icon-bg)"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#1E2C4A" stroke-width="1"/>

  <!-- Crossbar -->
  <path d="M 7,11 L 25,11" stroke="#4F7CFF" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- Left bow -->
  <path d="M 10.5,11 C 10.5,19 12.8,22 14.8,22.6" stroke="#4F7CFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Right bow -->
  <path d="M 21.5,11 C 21.5,19 19.2,22 17.2,22.6" stroke="#2E5BE0" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Central pivot -->
  <circle cx="16" cy="24.2" r="2.2" fill="#F5A623"/>
</svg>
