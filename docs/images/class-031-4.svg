<svg viewBox="0 0 820 580" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="580" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
  </defs>
  <!-- ════════ 源一：fat JAR（amber 主角） ════════ -->
  <rect x="60" y="24" width="340" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="230" y="52" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">fat JAR · yokeos-boot-0.1.0.jar</text>
  <text x="230" y="72" fill="#92400e" font-size="10" text-anchor="middle">自带全部依赖 + application.yaml + 管理台静态页</text>
  <text x="230" y="90" fill="#92400e" font-size="10" text-anchor="middle">java -jar 起手——25 节三连坑结构性消失</text>
  <!-- ════════ 源二：demo 资产（blue） ════════ -->
  <rect x="420" y="24" width="340" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="590" y="52" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">examples/demo/ · 资产四件套</text>
  <text x="590" y="72" fill="#334155" font-size="10" text-anchor="middle">weather-daily / daily-tech-digest</text>
  <text x="590" y="90" fill="#334155" font-size="10" text-anchor="middle">skills/digest-format / news-mcp</text>
  <!-- ════════ 汇流 → 走查容器（中性） ════════ -->
  <line x1="230" y1="104" x2="230" y2="120" stroke="#f59e0b" stroke-width="2"/>
  <line x1="590" y1="104" x2="590" y2="120" stroke="#3b82f6" stroke-width="2"/>
  <line x1="230" y1="120" x2="590" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="120" x2="410" y2="132" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <rect x="60" y="136" width="700" height="114" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="76" y="164" fill="#475569" font-size="12" font-weight="bold">干净目录 / 干净机器——只装 Java 21，照 README Quick Start 从零走</text>
  <rect x="84" y="182" width="148" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="158" y="207" fill="#475569" font-size="10.5" font-weight="bold" text-anchor="middle">1 · init 工作区</text>
  <rect x="252" y="182" width="148" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="326" y="207" fill="#475569" font-size="10.5" font-weight="bold" text-anchor="middle">2 · export 三道门</text>
  <rect x="420" y="182" width="148" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="494" y="207" fill="#475569" font-size="10.5" font-weight="bold" text-anchor="middle">3 · 放 demo 资产</text>
  <rect x="588" y="182" width="148" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="662" y="207" fill="#475569" font-size="10.5" font-weight="bold" text-anchor="middle">4 · serve 常驻</text>
  <text x="242" y="210" fill="#94a3b8" font-size="13" text-anchor="middle">→</text>
  <text x="410" y="210" fill="#94a3b8" font-size="13" text-anchor="middle">→</text>
  <text x="578" y="210" fill="#94a3b8" font-size="13" text-anchor="middle">→</text>
  <line x1="410" y1="250" x2="410" y2="272" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ 走查通过判据（green） ════════ -->
  <rect x="60" y="276" width="700" height="86" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="410" y="302" fill="#15803d" font-size="14" font-weight="bold" text-anchor="middle">两个 Demo 到点自跑 + 管理台七页可观察</text>
  <text x="410" y="324" fill="#166534" font-size="10.5" text-anchor="middle">30 分钟计时走查，每卡一步记档——缺的是文档不是代码</text>
  <text x="410" y="344" fill="#166534" font-size="10.5" text-anchor="middle">cron 08:00 / 09:00 就位，serve 常驻守住</text>
  <!-- ════════ 后置双路：人工发版 / 口径翻新（虚线旁注） ════════ -->
  <line x1="410" y1="362" x2="410" y2="378" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <line x1="230" y1="378" x2="590" y2="378" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <line x1="230" y1="378" x2="230" y2="392" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#yks)"/>
  <line x1="590" y1="378" x2="590" y2="392" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#yks)"/>
  <rect x="60" y="396" width="340" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="230" y="420" fill="#475569" font-size="12.5" font-weight="bold" text-anchor="middle">人工发版动作</text>
  <text x="230" y="440" fill="#64748b" font-size="10" text-anchor="middle">mvn clean verify 全绿 → CI 绿</text>
  <text x="230" y="458" fill="#64748b" font-size="10" text-anchor="middle">git tag v0.1.0（人执行）</text>
  <text x="230" y="476" fill="#64748b" font-size="10" text-anchor="middle">（可选）GitHub Release 附 JAR</text>
  <rect x="420" y="396" width="340" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="590" y="420" fill="#475569" font-size="12.5" font-weight="bold" text-anchor="middle">口径翻新（同批交付）</text>
  <text x="590" y="440" fill="#64748b" font-size="10" text-anchor="middle">README Quick Start 翻真实步骤</text>
  <text x="590" y="458" fill="#64748b" font-size="10" text-anchor="middle">website 承载页回写完成态</text>
  <text x="590" y="476" fill="#64748b" font-size="10" text-anchor="middle">指南 §4.2 §14→§13 citation 修正</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="410" y="530" fill="#475569" font-size="13" font-weight="bold" text-anchor="middle">pom 0.1.0-SNAPSHOT → 0.1.0（父 pom 一处）；演示域名预置缺省白名单，走查免重打包</text>
  <text x="410" y="552" fill="#94a3b8" font-size="10.5" text-anchor="middle">commit / 合流 / push / tag 全程人工——AI 只备齐证据（总纪律）</text>
</svg>
