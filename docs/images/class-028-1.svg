<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="560" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀，26/27 节同款） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykgr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
    <marker id="ykrd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
  <text x="410" y="26" fill="#334155" font-size="15" font-weight="bold" text-anchor="middle">三支柱让底座自己跑得稳：没人问也干活 · 重启不失忆 · 多 Agent 不打架（第 28 节）</text>

  <!-- ════════ 三支柱标题 ════════ -->
  <rect x="40" y="42" width="240" height="44" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
  <text x="160" y="60" fill="#b45309" font-size="13.5" font-weight="bold" text-anchor="middle">支柱一 · 钟推链路</text>
  <text x="160" y="78" fill="#92400e" font-size="10.5" text-anchor="middle">技 §12.1 Demo 一钟推形态预演</text>
  <rect x="290" y="42" width="240" height="44" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2.4"/>
  <text x="410" y="60" fill="#15803d" font-size="13.5" font-weight="bold" text-anchor="middle">支柱二 · 重启恢复</text>
  <text x="410" y="78" fill="#166534" font-size="10.5" text-anchor="middle">进程不存状态，状态全在进程外</text>
  <rect x="540" y="42" width="240" height="44" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.4"/>
  <text x="660" y="60" fill="#1d4ed8" font-size="13.5" font-weight="bold" text-anchor="middle">支柱三 · 多 Agent 并存</text>
  <text x="660" y="78" fill="#1e40af" font-size="10.5" text-anchor="middle">「OS」在核心阶段最小的体现</text>

  <!-- ════════ 三触发形态 ════════ -->
  <rect x="40" y="112" width="240" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="160" y="130" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">AgentScheduler 按 cron 到点</text>
  <text x="160" y="146" fill="#92400e" font-size="10" text-anchor="middle">拼一条消息交给 process</text>
  <text x="160" y="161" fill="#92400e" font-size="10" text-anchor="middle">三元组固定</text>
  <text x="160" y="173" fill="#92400e" font-size="10" text-anchor="middle">(scheduler, scheduler, agent)</text>
  <rect x="290" y="112" width="240" height="64" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="410" y="130" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">kill 进程 → 重新 serve</text>
  <text x="410" y="146" fill="#166534" font-size="10" text-anchor="middle">定义从 AGENT.md 重新注册（reconcile）</text>
  <text x="410" y="161" fill="#166534" font-size="10" text-anchor="middle">状态与历史不随进程消失</text>
  <rect x="540" y="112" width="240" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="660" y="130" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">三个差异 Profile 同实例</text>
  <text x="660" y="146" fill="#1e40af" font-size="10" text-anchor="middle">A 含记忆工具 · B 点名不含</text>
  <text x="660" y="161" fill="#1e40af" font-size="10" text-anchor="middle">C boom 坏 provider（坑八造法）</text>

  <line x1="160" y1="176" x2="280" y2="208" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <line x1="410" y1="176" x2="410" y2="208" stroke="#22c55e" stroke-width="2" marker-end="url(#ykgr)"/>
  <line x1="660" y1="176" x2="540" y2="208" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>

  <!-- ════════ 共享引擎（与人推同一条链路） ════════ -->
  <rect x="120" y="212" width="580" height="52" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="233" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">AgentService.process → ReAct → Tool/Provider</text>
  <text x="410" y="252" fill="#92400e" font-size="10.5" text-anchor="middle">与人推完全相同的引擎（第 27 节八站），一个字不用改 · ReActLoop 不感知触发来源</text>
  <line x1="410" y1="264" x2="410" y2="292" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>

  <!-- ════════ 进程外状态（重启恢复的根基） ════════ -->
  <rect x="40" y="296" width="740" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="410" y="316" fill="#475569" font-size="12.5" font-weight="bold" text-anchor="middle">状态全在进程外：SQLite（六表）+ 文件系统</text>
  <text x="410" y="334" fill="#64748b" font-size="10.5" text-anchor="middle">sessions · llm_calls · tool_invocations · scheduled_tasks（run_count/last_status） · task_executions</text>
  <text x="410" y="350" fill="#64748b" font-size="10.5" text-anchor="middle">MEMORY.md（记忆，天生跨重启） · AGENT.md（定义源，重启重读）</text>

  <!-- 重启环：进程死了，状态还在 -->
  <path d="M 240 360 C 240 400 300 404 340 404" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ykgr)"/>
  <text x="212" y="392" fill="#15803d" font-size="10" text-anchor="middle">重启只读不跑</text>
  <line x1="410" y1="360" x2="410" y2="400" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#yks)"/>

  <!-- ════════ 三支柱可验证终态（对账带） ════════ -->
  <rect x="40" y="408" width="240" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="160" y="428" fill="#b45309" font-size="11.5" font-weight="bold" text-anchor="middle">对账：不多不少</text>
  <text x="160" y="446" fill="#92400e" font-size="10" text-anchor="middle">两次触发仍一条会话（复用）</text>
  <text x="160" y="461" fill="#92400e" font-size="10" text-anchor="middle">http_get + notify 恰量全成功</text>
  <text x="160" y="476" fill="#92400e" font-size="10" text-anchor="middle">task 两表同步 · webhook 真收</text>
  <text x="160" y="493" fill="#b91c1c" font-size="10" text-anchor="middle">坏域名被拦 success=false，调度器不死</text>
  <rect x="290" y="408" width="240" height="96" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="410" y="428" fill="#15803d" font-size="11.5" font-weight="bold" text-anchor="middle">对账：四样回来</text>
  <text x="410" y="446" fill="#166534" font-size="10" text-anchor="middle">会话完整历史（SQLite）</text>
  <text x="410" y="461" fill="#166534" font-size="10" text-anchor="middle">记忆还在（MEMORY.md 文件）</text>
  <text x="410" y="476" fill="#166534" font-size="10" text-anchor="middle">定时状态+历史（两表，reconcile 不重置）</text>
  <text x="410" y="493" fill="#166534" font-size="10" text-anchor="middle">审计 llm_calls 不断档</text>
  <rect x="540" y="408" width="240" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="660" y="428" fill="#1d4ed8" font-size="11.5" font-weight="bold" text-anchor="middle">对账：三条隔离</text>
  <text x="660" y="446" fill="#1e40af" font-size="10" text-anchor="middle">工具：availableTools 只含点名清单</text>
  <text x="660" y="461" fill="#1e40af" font-size="10" text-anchor="middle">会话：三元组带 agent 名，互不串</text>
  <text x="660" y="476" fill="#1e40af" font-size="10" text-anchor="middle">定时：C 失败落账，A 随后照常成功</text>
  <text x="660" y="493" fill="#1e40af" font-size="10" text-anchor="middle">失败隔离的多 Agent 版</text>

  <rect x="40" y="522" width="740" height="26" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="410" y="539" fill="#475569" font-size="10.5" text-anchor="middle">三根支柱都固化成集成测试：SchedulerNotifyFlowIntegrationTest（真 key）· RestartRecoveryIntegrationTest（mock）· MultiAgentIsolationTest（gate 内）</text>
</svg>
