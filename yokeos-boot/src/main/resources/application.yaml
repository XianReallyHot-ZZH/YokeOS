spring:
  application:
    name: yokeos
  threads:
    virtual:
      # 决策四 / 宪法 4：同步阻塞 + JDK 21 虚拟线程承载并发，不引入响应式栈。
      enabled: true
  # 持久化接线（db/schema-001-audit.sql 头部预告的 16 节接线）：SQLite + JPA，
  # 手工建表脚本幂等执行（CREATE TABLE IF NOT EXISTS），禁 Hibernate 自动迁移（宪法 7）。
  datasource:
    # 工作区内的 SQLite（yokeos init 先行创建 .yokeos/；测试经 yokeos.db.dir 指到 target/）
    url: jdbc:sqlite:${yokeos.db.dir:.yokeos}/yokeos.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/schema-001-audit.sql
        - classpath:db/schema-002-sessions.sql
        - classpath:db/schema-003-memory.sql

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: yokeos

# 实例级 provider 清单（FR3 / 宪法 7）：全局层只管「连接」，AGENT.md frontmatter 管「调用参数」。
# 凭证只允许 ${ENV_VAR} 占位——明文 key 在启动期即被拒（ProvidersProperties.validate）。
# DeepSeek / Kimi 均为 OpenAI 兼容协议（research D1）；name 是显式映射键（宪法 3）。
yokeos:
  providers:
    - name: deepseek
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
    - name: kimi
      api-key: ${KIMI_API_KEY}
      base-url: https://api.moonshot.cn/v1
  # 22 节（specs/007）：记忆后端选档与阈值。mem0 段占位不走 Boot 绑定解析（research D6，
  # 经 MemoryProperties 原文读取）——切到 mem0 档使用时才校验，缺环境变量不阻断启动。
  memory:
    backend: markdown            # markdown（缺省，单机档）| sqlite（结构化档）| mem0（自托管集成档）
    archive-max-chars: 4000      # markdown 档归档区字符阈值（技 §5.1；核心区永不截断）
    archive-max-rows: 100        # sqlite 档归档区保留行数（LIMIT）
    mem0:
      base-url: ${MEM0_BASE_URL}
      api-key: ${MEM0_API_KEY}
  # 24 节（specs/009）：Sandbox 三重白名单——空白名单 = deny-all（什么都不允许），不是「不校验」。
  # 改白名单走配置变更重启生效，无运行时管理入口（管理端点列扩展阶段，技 §7.3 显式偏差）。
  sandbox:
    shell:
      allowed-commands: []       # 空 = 拒绝一切命令（诚实缺省：不存在有原则的默认命令集）
    http:
      allowed-domains: []        # 空 = 拒绝一切出站域名；Provider 调 LLM 不在管辖（api.deepseek.com 无需在单）。
                                 # 切 mem0 档须把 mem0 host 加入本清单（否则记忆后端被自家拦，坑六/D9）
    # file.allowed-paths 缺省 = 当前工作区根（随 yokeos.root 解析，坑七：工作区随启动目录动态、静态写不了）。
    # 要覆盖时取消注释——覆盖后须自行包含工作区，否则 save_memory / 产出物写入被自家沙箱拦截（坑六）：
    # file:
    #   allowed-paths:
    #     - .yokeos
