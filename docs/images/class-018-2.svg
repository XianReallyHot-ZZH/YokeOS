<svg viewBox="0 0 880 452" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="880" height="452" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
    <marker id="ykgr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="ykrd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
  <!-- ════════ 上带：门 vs 干活的人 ════════ -->
  <rect x="64" y="24" width="330" height="92" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="229" y="48" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">CLI 壳 —— 读 · 转交 · 打印</text>
  <text x="229" y="68" fill="#6366f1" font-size="11" text-anchor="middle">读用户输入 → agentService.process → 打印回复</text>
  <text x="229" y="88" fill="#64748b" font-size="9.5" text-anchor="middle">不想 · 不调模型 · 不执行工具（宪法 2）</text>
  <line x1="394" y1="70" x2="470" y2="70" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <text x="432" y="60" fill="#475569" font-size="10" text-anchor="middle">转交</text>
  <rect x="474" y="24" width="342" height="92" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="645" y="48" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">引擎 —— 干活的人</text>
  <text x="645" y="68" fill="#92400e" font-size="11" text-anchor="middle">AgentService · ReAct · Provider · ToolExecutor</text>
  <text x="645" y="88" fill="#64748b" font-size="9.5" text-anchor="middle">Agent 智能全在这边（16 / 17 节交付）</text>
  <!-- ════════ 下带：轻重分流（入口 → 判定 → 一分二） ════════ -->
  <rect x="64" y="156" width="190" height="56" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="159" y="178" fill="#4338ca" font-size="12.5" font-weight="bold" text-anchor="middle">yokeos &lt;子命令&gt;</text>
  <text x="159" y="196" fill="#6366f1" font-size="10" text-anchor="middle">12 个命令（需 §5.13）</text>
  <line x1="254" y1="184" x2="300" y2="184" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <rect x="304" y="156" width="240" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="424" y="178" fill="#475569" font-size="12.5" font-weight="bold" text-anchor="middle">要调模型 / 跑引擎？</text>
  <text x="424" y="196" fill="#64748b" font-size="10" text-anchor="middle">轻重分流的唯一标准（技 §8.7）</text>
  <!-- 一分二：底部竖 → 横 → 双竖 -->
  <line x1="424" y1="212" x2="424" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="240" x2="610" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="240" x2="230" y2="272" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <line x1="610" y1="240" x2="610" y2="272" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <text x="252" y="232" fill="#475569" font-size="10" text-anchor="middle">否</text>
  <text x="588" y="232" fill="#475569" font-size="10" text-anchor="middle">是</text>
  <!-- ════════ 轻命令（green）/ 重命令（blue） ════════ -->
  <rect x="64" y="276" width="340" height="92" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="234" y="300" fill="#15803d" font-size="13.5" font-weight="bold" text-anchor="middle">轻命令 —— 零 Spring，秒回</text>
  <text x="234" y="320" fill="#166534" font-size="10.5" text-anchor="middle">init · status · profile list/create/show/delete</text>
  <text x="234" y="340" fill="#166534" font-size="9.5" text-anchor="middle">provider/tool/session list —— 纯文件 / JDBC 直达</text>
  <rect x="476" y="276" width="340" height="92" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="646" y="300" fill="#1d4ed8" font-size="13.5" font-weight="bold" text-anchor="middle">重命令 —— 才启动 Spring</text>
  <text x="646" y="320" fill="#334155" font-size="10.5" text-anchor="middle">chat · serve · gateway（后两者本节骨架）</text>
  <text x="646" y="340" fill="#64748b" font-size="9.5" text-anchor="middle">YokeosRuntime 上下文 + 引擎，启动 2~4 秒</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="440" y="404" fill="#475569" font-size="11" text-anchor="middle">CLI 是消息进出的门，不是干活的人；轻重分流一开始定死，后改伤筋动骨</text>
  <text x="440" y="422" fill="#94a3b8" font-size="10" text-anchor="middle">「看一眼就退」的命令不值得等 Spring 启动（参照课件第 18 节坑二）</text>
  <text x="440" y="440" fill="#94a3b8" font-size="10" text-anchor="middle">轻命令秒回的证据进验收报告（脚本计时）；serve 的 REST 端点归 26 节</text>
</svg>
