<svg viewBox="0 0 880 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="880" height="450" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
    <marker id="ykgr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="ykrd" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
  <!-- ════════ 入口：一条用户消息 ════════ -->
  <rect x="280" y="24" width="320" height="52" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="440" y="48" fill="#4338ca" font-size="16" font-weight="bold" text-anchor="middle">一条用户消息</text>
  <text x="440" y="66" fill="#6366f1" font-size="12" text-anchor="middle">进入 Session 对话历史</text>
  <line x1="440" y1="76" x2="440" y2="112" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ 主角：ReAct 循环容器（每转一圈） ════════ -->
  <rect x="60" y="116" width="640" height="176" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="84" y="142" fill="#b45309" font-size="14" font-weight="bold">ReAct 循环 · 每转一圈</text>
  <!-- 三相位（blue 子组件） -->
  <rect x="88" y="160" width="176" height="78" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="176" y="184" fill="#1d4ed8" font-size="13.5" font-weight="bold" text-anchor="middle">Reason 想一步</text>
  <text x="176" y="202" fill="#334155" font-size="10" text-anchor="middle">经 Provider 调一次 LLM</text>
  <text x="176" y="220" fill="#64748b" font-size="9.5" text-anchor="middle">llm_calls 留痕</text>
  <rect x="292" y="160" width="176" height="78" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="380" y="184" fill="#1d4ed8" font-size="13.5" font-weight="bold" text-anchor="middle">Act 做一步</text>
  <text x="380" y="202" fill="#334155" font-size="10" text-anchor="middle">ToolExecutor 执行工具</text>
  <text x="380" y="220" fill="#64748b" font-size="9.5" text-anchor="middle">tool_invocations 留痕</text>
  <rect x="496" y="160" width="176" height="78" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="584" y="184" fill="#1d4ed8" font-size="13.5" font-weight="bold" text-anchor="middle">Observe 看结果</text>
  <text x="584" y="202" fill="#334155" font-size="10" text-anchor="middle">结果回填 Session 历史</text>
  <text x="584" y="220" fill="#64748b" font-size="9.5" text-anchor="middle">成败都进历史</text>
  <!-- 相位间箭头 -->
  <line x1="264" y1="199" x2="288" y2="199" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <line x1="468" y1="199" x2="492" y2="199" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <!-- 回环：不够就再来一轮（amber 主角机制） -->
  <path d="M584,238 L584,258 L176,258 L176,242" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <text x="380" y="276" fill="#92400e" font-size="11" text-anchor="middle">不够就再来一轮 · 默认最多 10 轮</text>
  <!-- ════════ 出口对：正常收尾 / 强制兜底 ════════ -->
  <text x="248" y="310" fill="#475569" font-size="9.5">模型没再要调工具</text>
  <line x1="240" y1="292" x2="240" y2="326" stroke="#22c55e" stroke-width="2" marker-end="url(#ykgr)"/>
  <text x="648" y="310" fill="#475569" font-size="9.5">转满 maxIterations（默认 10）</text>
  <line x1="640" y1="292" x2="640" y2="326" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd)"/>
  <rect x="100" y="330" width="280" height="54" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="240" y="352" fill="#15803d" font-size="14" font-weight="bold" text-anchor="middle">返回最终响应</text>
  <text x="240" y="370" fill="#166534" font-size="10.5" text-anchor="middle">循环结束，答复交回触发源</text>
  <rect x="500" y="330" width="280" height="54" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="640" y="352" fill="#b91c1c" font-size="14" font-weight="bold" text-anchor="middle">强制收尾（防死循环兜底）</text>
  <text x="640" y="370" fill="#b91c1c" font-size="10.5" text-anchor="middle">「达到最大轮数，已停止」</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="440" y="418" fill="#475569" font-size="11" text-anchor="middle">ReAct = Reasoning + Acting：模型自己决定何时查工具、何时给答复——2022 年提出，现在是事实标准</text>
  <text x="440" y="436" fill="#94a3b8" font-size="10" text-anchor="middle">每轮的 LLM 调用与工具执行都留痕审计（宪法 7：day one）</text>
</svg>
