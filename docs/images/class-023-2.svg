<svg viewBox="0 0 820 442" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="442" fill="#ffffff"/>

  <!-- ════════ 纵深防御六层（自下而上层层设防）+ 第一阶段形态 chip ════════ -->
  <!-- 第一层：应用层白名单（本章主角） -->
  <rect x="90" y="40" width="450" height="48" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="315" y="60" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">应用层白名单</text>
  <text x="315" y="78" fill="#92400e" font-size="10" text-anchor="middle">WhitelistSandbox：路径 · 命令 · 域名三重校验</text>
  <rect x="572" y="51" width="176" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="660" y="68" fill="#475569" font-size="9.5" text-anchor="middle">本节定稿 · 24 节接线</text>

  <!-- 第二层：强隔离（扩展阶段） -->
  <rect x="90" y="98" width="450" height="48" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="315" y="118" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">强隔离（容器 → microVM）</text>
  <text x="315" y="136" fill="#7c3aed" font-size="10" text-anchor="middle">namespace+cgroups+seccomp → Firecracker/Kata/gVisor</text>
  <rect x="572" y="109" width="176" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="660" y="126" fill="#475569" font-size="9.5" text-anchor="middle">扩展阶段 · 信号驱动</text>

  <!-- 第三层：网络出口控制 -->
  <rect x="90" y="156" width="450" height="48" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="315" y="176" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">网络出口控制</text>
  <text x="315" y="194" fill="#334155" font-size="10" text-anchor="middle">域名白名单（http / notify / mem0 host）</text>
  <rect x="572" y="167" width="176" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="660" y="184" fill="#475569" font-size="9.5" text-anchor="middle">第一阶段 · 应用层形态</text>

  <!-- 第四层：资源配额 -->
  <rect x="90" y="214" width="450" height="48" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="315" y="234" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">资源配额</text>
  <text x="315" y="252" fill="#334155" font-size="10" text-anchor="middle">Shell 超时 + 超长输出截断</text>
  <rect x="572" y="225" width="176" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="660" y="242" fill="#475569" font-size="9.5" text-anchor="middle">第一阶段 · 缩放形态</text>

  <!-- 第五层：最小权限 -->
  <rect x="90" y="272" width="450" height="48" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="315" y="292" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">最小权限</text>
  <text x="315" y="310" fill="#334155" font-size="10" text-anchor="middle">Profile tools 字段限定每个 Agent 的工具面</text>
  <rect x="572" y="283" width="176" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="660" y="300" fill="#475569" font-size="9.5" text-anchor="middle">第一阶段 · 雏形</text>

  <!-- 第六层：全链路审计 -->
  <rect x="90" y="330" width="450" height="48" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="315" y="350" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">全链路审计</text>
  <text x="315" y="368" fill="#7c3aed" font-size="10" text-anchor="middle">tool_invocations / llm_calls · day one 落库 · 拒绝也留痕</text>
  <rect x="572" y="341" width="176" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="660" y="358" fill="#475569" font-size="9.5" text-anchor="middle">第一阶段 · 完整形态</text>

  <!-- ════════ 结论行 ════════ -->
  <text x="410" y="414" fill="#64748b" font-size="12" text-anchor="middle">沙箱不是开关，是一套组合——白名单防误操作，审计与最小权限与隔离同等重要，没有任何一层是万能的</text>
</svg>
