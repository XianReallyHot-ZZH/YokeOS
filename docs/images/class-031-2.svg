<svg viewBox="0 0 820 710" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="710" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
    <marker id="ykpu" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/></marker>
  </defs>
  <!-- ════════ 钟推入口（indigo） ════════ -->
  <rect x="180" y="24" width="460" height="60" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="410" y="50" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">钟推触发 · AgentScheduler</text>
  <text x="410" y="70" fill="#6366f1" font-size="10" text-anchor="middle">cron 0 0 8 * * *（id: weather-morning）· channel=user=scheduler</text>
  <line x1="410" y1="84" x2="410" y2="108" stroke="#6366f1" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ 主角：同一条执行链（amber） ════════ -->
  <rect x="180" y="112" width="460" height="68" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="410" y="138" fill="#b45309" font-size="15" font-weight="bold" text-anchor="middle">AgentService.process——人推钟推同一条链</text>
  <text x="410" y="158" fill="#92400e" font-size="9.5" text-anchor="middle">人推补跑：yokeos chat 或 POST /agents/weather-daily/invoke</text>
  <text x="410" y="174" fill="#92400e" font-size="9.5" text-anchor="middle">钟推报文写明「无论历史如何本次都重新执行」（28 节坑）</text>
  <line x1="410" y1="180" x2="410" y2="204" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <!-- ════════ ReAct 第 1 轮（blue） ════════ -->
  <rect x="180" y="208" width="460" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="232" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">ReAct 第 1 轮 · PromptBuilder + DeepSeek</text>
  <text x="410" y="252" fill="#334155" font-size="9.5" text-anchor="middle">system prompt = AGENT.md 正文 + Bootstrap（光杆，无附属资源）</text>
  <text x="410" y="270" fill="#334155" font-size="9.5" text-anchor="middle">模型决定调 http_get——llm_calls 落账</text>
  <text x="168" y="244" fill="#64748b" font-size="9.5" text-anchor="end">tool call:</text>
  <text x="168" y="258" fill="#64748b" font-size="9.5" text-anchor="end">http_get</text>
  <line x1="410" y1="280" x2="410" y2="304" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <!-- ════════ Sandbox 域名白名单（purple） ════════ -->
  <rect x="180" y="308" width="460" height="52" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="410" y="330" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">Sandbox.enforce——域名白名单放行</text>
  <text x="410" y="348" fill="#7c3aed" font-size="9.5" text-anchor="middle">api.open-meteo.com 在单；不在单即拦且照记账（success=false）</text>
  <line x1="410" y1="360" x2="410" y2="384" stroke="#a855f7" stroke-width="2" marker-end="url(#ykpu)"/>
  <!-- ════════ 外部：open-meteo（green） ════════ -->
  <rect x="180" y="388" width="460" height="56" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="410" y="412" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">open-meteo 天气 API</text>
  <text x="410" y="432" fill="#166534" font-size="10" text-anchor="middle">免 key · 返回 JSON（温度 / 湿度 / 降水 / 风速）</text>
  <text x="168" y="420" fill="#64748b" font-size="9.5" text-anchor="end">天气 JSON 回填</text>
  <text x="168" y="434" fill="#64748b" font-size="9.5" text-anchor="end">对话历史</text>
  <line x1="410" y1="444" x2="410" y2="468" stroke="#22c55e" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ ReAct 第 2 轮（blue） ════════ -->
  <rect x="180" y="472" width="460" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="496" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">ReAct 第 2 轮 · 生成穿搭建议 → 调 notify</text>
  <text x="410" y="516" fill="#334155" font-size="9.5" text-anchor="middle">把「今日天气 + 穿搭建议」组织成一条适合发群的消息</text>
  <text x="410" y="534" fill="#334155" font-size="9.5" text-anchor="middle">notify(team-im)——webhook 域名同样过白名单</text>
  <line x1="410" y1="544" x2="410" y2="568" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <!-- ════════ 外部：webhook 收件（green） ════════ -->
  <rect x="180" y="572" width="460" height="64" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="410" y="596" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">webhook.site / 企业 IM 群机器人</text>
  <text x="410" y="616" fill="#166534" font-size="10" text-anchor="middle">收到「今日天气 + 穿搭建议」——人推补跑收到同款</text>
  <!-- ════════ 旁注：审计三表（purple，虚线接入） ════════ -->
  <rect x="664" y="270" width="132" height="130" rx="6" fill="#ede9fe" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="5,3"/>
  <line x1="640" y1="334" x2="664" y2="334" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="730" y="294" fill="#6b21a8" font-size="11.5" font-weight="bold" text-anchor="middle">审计三表</text>
  <text x="730" y="310" fill="#6b21a8" font-size="11.5" font-weight="bold" text-anchor="middle">day one</text>
  <text x="730" y="330" fill="#7c3aed" font-size="9" text-anchor="middle">tool_invocations ×2</text>
  <text x="730" y="346" fill="#7c3aed" font-size="9" text-anchor="middle">（http_get、notify）</text>
  <text x="730" y="362" fill="#7c3aed" font-size="9" text-anchor="middle">llm_calls 每轮一条</text>
  <text x="730" y="378" fill="#7c3aed" font-size="9" text-anchor="middle">sessions 完整对话</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="410" y="672" fill="#475569" font-size="13" font-weight="bold" text-anchor="middle">两次涉外调用（查天气、推送）各一次 HTTP——都过白名单、都写审计，全程无人触发</text>
  <text x="410" y="694" fill="#94a3b8" font-size="10.5" text-anchor="middle">GET /api/v1/sessions/{id} 查到本次钟推完整对话；人推补跑行为一致（对账第 5、6 条）</text>
</svg>
