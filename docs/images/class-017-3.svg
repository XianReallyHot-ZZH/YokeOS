<svg viewBox="0 0 980 570" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="980" height="570" fill="#ffffff"/>
  <!-- ════════ defs：marker（yk 前缀） ════════ -->
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykbl" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker>
    <marker id="ykgr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="ykpu" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/></marker>
  </defs>
  <!-- ════════ 第一行：编排链（入口 indigo + 主角 amber） ════════ -->
  <rect x="40" y="28" width="170" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="125" y="52" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">用户消息</text>
  <text x="125" y="70" fill="#6366f1" font-size="10" text-anchor="middle">触发源：CLI / Web / 定时</text>
  <rect x="270" y="28" width="200" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="370" y="48" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">AgentService</text>
  <text x="370" y="64" fill="#6366f1" font-size="9.5" text-anchor="middle">三触发源共用的 process()</text>
  <text x="370" y="80" fill="#6366f1" font-size="8.5" text-anchor="middle">ProfileContext set · finally clear</text>
  <rect x="530" y="28" width="170" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="615" y="48" fill="#b45309" font-size="15" font-weight="bold" text-anchor="middle">ReActLoop</text>
  <text x="615" y="66" fill="#92400e" font-size="11" text-anchor="middle">只做调度 · 数十行</text>
  <text x="615" y="82" fill="#92400e" font-size="9" text-anchor="middle">默认最多 10 轮</text>
  <line x1="210" y1="60" x2="266" y2="60" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <line x1="470" y1="60" x2="526" y2="60" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <!-- ════════ 走廊：下行进循环体（amber）/ 上行收尾返回（green） ════════ -->
  <path d="M615,92 L615,114 L125,114 L125,154" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <text x="370" y="110" fill="#92400e" font-size="10" text-anchor="middle">每轮：组装 → 调 LLM → 判停 → 执行</text>
  <path d="M370,158 L370,138 L660,138 L660,92" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#ykgr)"/>
  <text x="515" y="134" fill="#64748b" font-size="9.5" text-anchor="middle">响应 · 无 toolCalls → 收尾返回</text>
  <!-- ════════ 第二行：循环体四件（blue 子组件） ════════ -->
  <rect x="40" y="158" width="190" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="135" y="180" fill="#1d4ed8" font-size="13.5" font-weight="bold" text-anchor="middle">PromptBuilder</text>
  <text x="135" y="198" fill="#334155" font-size="9.5" text-anchor="middle">system + 日期时间 + 历史</text>
  <rect x="270" y="158" width="200" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="370" y="180" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">SpringAiProviderService</text>
  <text x="370" y="198" fill="#334155" font-size="9.5" text-anchor="middle">真调模型 · 审计 llm_calls</text>
  <rect x="530" y="158" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="615" y="180" fill="#1d4ed8" font-size="13.5" font-weight="bold" text-anchor="middle">ToolExecutor</text>
  <text x="615" y="198" fill="#334155" font-size="9.5" text-anchor="middle">唯一执行路径 · 审计</text>
  <rect x="760" y="158" width="180" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="850" y="180" fill="#1d4ed8" font-size="13.5" font-weight="bold" text-anchor="middle">HttpGetTool</text>
  <text x="850" y="198" fill="#334155" font-size="9.5" text-anchor="middle">HttpClient · 超时 10s</text>
  <line x1="230" y1="185" x2="266" y2="185" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <line x1="470" y1="185" x2="526" y2="185" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <text x="498" y="177" fill="#64748b" font-size="8.5" text-anchor="middle">有 toolCalls</text>
  <line x1="700" y1="185" x2="756" y2="185" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <!-- ════════ 第三行：供给与外部（旁注虚线 + green 外部） ════════ -->
  <rect x="24" y="296" width="150" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="99" y="314" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">ContextLoader</text>
  <text x="99" y="330" fill="#64748b" font-size="8.5" text-anchor="middle">identity + Bootstrap</text>
  <text x="99" y="344" fill="#64748b" font-size="8.5" text-anchor="middle">+ AGENT.md 正文（现读）</text>
  <text x="99" y="358" fill="#64748b" font-size="8.5" text-anchor="middle">无缓存铁律</text>
  <rect x="300" y="296" width="170" height="62" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="385" y="320" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">ChatModel · 真模型</text>
  <text x="385" y="338" fill="#166534" font-size="9.5" text-anchor="middle">DeepSeek / Kimi 显式映射</text>
  <rect x="760" y="296" width="180" height="62" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="850" y="320" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">外部 API</text>
  <text x="850" y="338" fill="#166534" font-size="9.5" text-anchor="middle">open-meteo · 天气端点</text>
  <line x1="335" y1="212" x2="335" y2="292" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <text x="343" y="258" fill="#64748b" font-size="8.5">真调</text>
  <line x1="850" y1="212" x2="850" y2="292" stroke="#3b82f6" stroke-width="2" marker-end="url(#ykbl)"/>
  <!-- ════════ 回环：工具结果回填进下一轮（amber） ════════ -->
  <path d="M585,212 L585,386 L195,386 L195,216" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam)"/>
  <text x="390" y="402" fill="#b45309" font-size="10" text-anchor="middle">工具结果回填 Session · 进下一轮</text>
  <!-- ════════ 第四行：审计与累积（purple 数据） ════════ -->
  <rect x="40" y="444" width="170" height="50" rx="8" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="125" y="466" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">Session</text>
  <text x="125" y="482" fill="#7c3aed" font-size="9" text-anchor="middle">内存版 · 正常收尾才 save</text>
  <rect x="270" y="444" width="200" height="50" rx="8" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="370" y="466" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">llm_calls</text>
  <text x="370" y="482" fill="#7c3aed" font-size="9" text-anchor="middle">每次 LLM 调用 · 成败都记</text>
  <rect x="530" y="444" width="170" height="50" rx="8" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="615" y="466" fill="#6b21a8" font-size="12" font-weight="bold" text-anchor="middle">tool_invocations</text>
  <text x="615" y="482" fill="#7c3aed" font-size="9" text-anchor="middle">每次工具执行 · 成败都记</text>
  <!-- 审计落笔（purple 虚线旁路） -->
  <line x1="285" y1="212" x2="285" y2="440" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#ykpu)"/>
  <text x="279" y="345" fill="#7c3aed" font-size="8.5" text-anchor="end">审计落笔</text>
  <line x1="660" y1="212" x2="660" y2="440" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#ykpu)"/>
  <text x="666" y="345" fill="#7c3aed" font-size="8.5">审计落笔</text>
  <!-- ════════ 注脚 ════════ -->
  <text x="490" y="520" fill="#475569" font-size="11" text-anchor="middle">每轮两组留痕：LLM 调用落 llm_calls、工具执行落 tool_invocations——审计 day one（宪法 7）</text>
  <text x="490" y="538" fill="#94a3b8" font-size="10" text-anchor="middle">Session 内存版（持久化归 18 节）；Sandbox 检查位在 ToolExecutor · 24 节接线</text>
</svg>
