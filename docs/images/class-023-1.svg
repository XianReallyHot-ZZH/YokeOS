<svg viewBox="0 0 820 352" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="352" fill="#ffffff"/>
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <!-- ════════ 档位阶梯（越往右越强越贵） ════════ -->
  <!-- 第一档：应用层白名单（本章主角，YokeOS 第一阶段站位） -->
  <rect x="50" y="174" width="150" height="22" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="125" y="189" fill="#475569" font-size="9.5" text-anchor="middle">YokeOS 第一阶段站位</text>
  <rect x="40" y="210" width="170" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="125" y="235" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">应用层白名单</text>
  <text x="125" y="255" fill="#92400e" font-size="10" text-anchor="middle">零开销 · 劝阻级</text>

  <!-- 第二档：容器隔离 -->
  <rect x="232" y="158" width="170" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="317" y="183" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">容器隔离</text>
  <text x="317" y="203" fill="#334155" font-size="10" text-anchor="middle">namespace+cgroups+seccomp</text>

  <!-- 第三档：microVM -->
  <rect x="424" y="106" width="170" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="509" y="131" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">microVM</text>
  <text x="509" y="151" fill="#334155" font-size="10" text-anchor="middle">Firecracker · Kata · gVisor</text>

  <!-- 第四档：完整 VM / 物理隔离 -->
  <rect x="616" y="54" width="170" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="701" y="79" fill="#475569" font-size="13" font-weight="bold" text-anchor="middle">完整 VM / 物理隔离</text>
  <text x="701" y="99" fill="#64748b" font-size="10" text-anchor="middle">最强 · 最贵 · 极少使用</text>

  <!-- ════════ 正交阶梯连线 ════════ -->
  <path d="M210,242 L221,242 L221,190 L232,190" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>
  <path d="M402,190 L413,190 L413,138 L424,138" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>
  <path d="M594,138 L605,138 L605,86 L616,86" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>

  <!-- ════════ 底部强度轴与结论 ════════ -->
  <text x="413" y="288" fill="#475569" font-size="12" text-anchor="middle">越往右：隔离越强 · 开销越大 · 启动越慢</text>
  <line x1="40" y1="296" x2="786" y2="296" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks)"/>
  <text x="410" y="326" fill="#94a3b8" font-size="11" text-anchor="middle">选方案就是在这条线上选一个点——YokeOS 跑企业自配的可信 Agent，站在最左档</text>
</svg>
