<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="960" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ykam7" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykpu7" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/></marker>
    <marker id="ykgr7" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="ykrd7" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>

  <!-- Built-in tools -->
  <rect x="40" y="60" width="230" height="64" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="86" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">FileTools</text>
  <text x="155" y="106" fill="#334155" font-size="10" text-anchor="middle">read_file · write_file · list_dir</text>
  <rect x="40" y="160" width="230" height="64" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="186" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">ShellTools</text>
  <text x="155" y="206" fill="#334155" font-size="10" text-anchor="middle">shell · argv 直传 · 超时</text>
  <rect x="40" y="260" width="230" height="64" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="286" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">HttpTools</text>
  <text x="155" y="306" fill="#334155" font-size="10" text-anchor="middle">http_get · http_post</text>

  <!-- Converge into enforce -->
  <path d="M270,92 L305,92 L305,166 L336,166" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam7)"/>
  <line x1="270" y1="192" x2="336" y2="192" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam7)"/>
  <path d="M270,292 L305,292 L305,218 L336,218" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam7)"/>

  <!-- Enforce (hero) -->
  <rect x="340" y="140" width="230" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="455" y="166" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">WhitelistSandbox.enforce</text>
  <text x="455" y="186" fill="#92400e" font-size="9.5" text-anchor="middle">SandboxAction = { type, target }</text>
  <text x="455" y="202" fill="#92400e" font-size="9.5" text-anchor="middle">FILE_READ / FILE_WRITE</text>
  <text x="455" y="218" fill="#92400e" font-size="9.5" text-anchor="middle">SHELL_COMMAND / HTTP_REQUEST</text>

  <line x1="570" y1="190" x2="606" y2="190" stroke="#a855f7" stroke-width="2" marker-end="url(#ykpu7)"/>

  <!-- Checks container -->
  <rect x="610" y="48" width="180" height="300" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="700" y="70" fill="#7c3aed" font-size="11" font-weight="bold" text-anchor="middle">按 ActionType 路由</text>
  <rect x="624" y="92" width="152" height="64" rx="6" fill="#ede9fe" stroke="#a855f7" stroke-width="1.6"/>
  <text x="700" y="116" fill="#6b21a8" font-size="11" font-weight="bold" text-anchor="middle">checkFilePath</text>
  <text x="700" y="134" fill="#7c3aed" font-size="8.5" text-anchor="middle">真实路径在白名单根内</text>
  <text x="700" y="148" fill="#7c3aed" font-size="8.5" text-anchor="middle">防 ../ 路径穿越</text>
  <rect x="624" y="180" width="152" height="64" rx="6" fill="#ede9fe" stroke="#a855f7" stroke-width="1.6"/>
  <text x="700" y="204" fill="#6b21a8" font-size="11" font-weight="bold" text-anchor="middle">checkShellCommand</text>
  <text x="700" y="222" fill="#7c3aed" font-size="8.5" text-anchor="middle">可执行文件精确白名单</text>
  <text x="700" y="236" fill="#7c3aed" font-size="8.5" text-anchor="middle">配置在 application.yaml</text>
  <rect x="624" y="268" width="152" height="64" rx="6" fill="#ede9fe" stroke="#a855f7" stroke-width="1.6"/>
  <text x="700" y="292" fill="#6b21a8" font-size="11" font-weight="bold" text-anchor="middle">checkHttpUrl</text>
  <text x="700" y="310" fill="#7c3aed" font-size="8.5" text-anchor="middle">解析 host</text>
  <text x="700" y="324" fill="#7c3aed" font-size="8.5" text-anchor="middle">通配符匹配</text>

  <!-- Outcome split -->
  <line x1="700" y1="348" x2="700" y2="376" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="376" x2="760" y2="376" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="376" x2="320" y2="394" stroke="#22c55e" stroke-width="2" marker-end="url(#ykgr7)"/>
  <line x1="760" y1="376" x2="760" y2="394" stroke="#ef4444" stroke-width="2" marker-end="url(#ykrd7)"/>

  <rect x="170" y="398" width="300" height="64" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="320" y="424" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">校验通过 → 执行真正的 IO</text>
  <text x="320" y="444" fill="#166534" font-size="10" text-anchor="middle">文件读写 · 命令执行 · HTTP 请求</text>
  <rect x="580" y="398" width="360" height="64" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="760" y="424" fill="#b91c1c" font-size="13" font-weight="bold" text-anchor="middle">校验失败 → SandboxViolationException</text>
  <text x="760" y="444" fill="#b91c1c" font-size="10" text-anchor="middle">复用 ToolExecutor 失败审计 · 写 tool_invocations（success=false）</text>
</svg>
