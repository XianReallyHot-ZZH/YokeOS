<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>
  <defs>
    <marker id="yks5" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ykam5" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ykrd5" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
    <marker id="ykgr5" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
  </defs>

  <!-- LLM decision -->
  <rect x="40" y="40" width="220" height="56" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="150" y="64" fill="#4338ca" font-size="14" font-weight="bold" text-anchor="middle">LLM 决定调用</text>
  <text x="150" y="84" fill="#6366f1" font-size="10" text-anchor="middle">Function Calling 指名 Tool + 参数</text>

  <line x1="260" y1="68" x2="300" y2="68" stroke="#94a3b8" stroke-width="2" marker-end="url(#yks5)"/>

  <!-- Executor -->
  <rect x="304" y="40" width="240" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="424" y="64" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">ToolExecutor</text>
  <text x="424" y="84" fill="#92400e" font-size="10" text-anchor="middle">查 ToolRegistry · Sandbox.enforce 校验</text>

  <!-- Split to two runtimes -->
  <line x1="544" y1="68" x2="566" y2="68" stroke="#f59e0b" stroke-width="2"/>
  <line x1="566" y1="46" x2="566" y2="106" stroke="#f59e0b" stroke-width="2"/>
  <line x1="566" y1="46" x2="588" y2="46" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam5)"/>
  <line x1="566" y1="106" x2="588" y2="106" stroke="#f59e0b" stroke-width="2" marker-end="url(#ykam5)"/>

  <!-- Execution container -->
  <rect x="592" y="16" width="200" height="124" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5,3"/>
  <rect x="602" y="28" width="180" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="692" y="47" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">内置 Tool · 进程内执行</text>
  <text x="692" y="64" fill="#334155" font-size="9.5" text-anchor="middle">文件 / Shell / HTTP / 记忆 / 通知</text>
  <rect x="602" y="84" width="180" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="692" y="103" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">MCP Tool · 协议转发</text>
  <text x="692" y="120" fill="#334155" font-size="9.5" text-anchor="middle">McpToolAdapter · JSON-RPC</text>

  <!-- Converge to result -->
  <path d="M692,140 L692,172 L424,172 L424,178" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#ykgr5)"/>

  <!-- Result band -->
  <rect x="40" y="182" width="750" height="52" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="415" y="206" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">ToolResult（success · content · errorMessage · retryable）→ 结果回填对话历史</text>
  <text x="415" y="226" fill="#166534" font-size="10" text-anchor="middle">两条路都包装成同一个 YokeTool 抽象，ReAct 循环不感知 Tool 来源</text>

  <!-- Reject path -->
  <line x1="424" y1="96" x2="424" y2="256" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#ykrd5)"/>
  <rect x="40" y="260" width="750" height="52" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="415" y="284" fill="#b91c1c" font-size="13" font-weight="bold" text-anchor="middle">校验失败 → SandboxViolationException，Tool 执行终止</text>
  <text x="415" y="304" fill="#b91c1c" font-size="10" text-anchor="middle">复用 ToolExecutor 失败审计路径写 tool_invocations（success=false），不为 Sandbox 新增审计逻辑</text>

  <!-- Bottom note -->
  <text x="415" y="356" fill="#64748b" font-size="12" text-anchor="middle">成功失败都写 tool_invocations；失败时按可重试策略返回错误信息，默认指数退避最多三次</text>
</svg>
