<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 60" width="256" height="60">
  <!-- ── Mark: the yoke — a crossbar with two symmetric bows meeting at a central pivot ── -->
  <!-- Crossbar -->
  <path d="M 8,16 L 48,16" stroke="#4F7CFF" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Left bow -->
  <path d="M 14,16 C 14,36 19,43 26,44" stroke="#4F7CFF" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Right bow -->
  <path d="M 42,16 C 42,36 37,43 30,44" stroke="#2E5BE0" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Central pivot (the harness point both bows share) -->
  <circle cx="28" cy="47" r="4" fill="#F5A623"/>

  <!-- ── Wordmark ── -->
  <text x="60" y="45"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="42" font-weight="900" letter-spacing="-1.5"
        fill="#4F7CFF">Yoke<tspan fill="#F5A623">OS</tspan></text>
</svg>
