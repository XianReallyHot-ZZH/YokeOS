<svg viewBox="0 0 820 210" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="820" height="210" fill="#ffffff"/>
  <defs>
    <marker id="yks" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <!-- ════════ 不缓存契约四步 ════════ -->
  <rect x="40" y="56" width="170" height="76" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="125" y="82" fill="#4338ca" font-size="12" font-weight="bold" text-anchor="middle">① 模型调 save_memory</text>
  <text x="125" y="104" fill="#6366f1" font-size="9.5" text-anchor="middle">ReAct 循环里 Agent 主动调</text>

  <rect x="232" y="56" width="170" height="76" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="317" y="82" fill="#6b21a8" font-size="12" font-weight="bold" text-anchor="middle">② 落盘 / 入库</text>
  <text x="317" y="104" fill="#7c3aed" font-size="9.5" text-anchor="middle">MEMORY.md 追加 / insert</text>

  <rect x="424" y="56" width="170" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="509" y="82" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">③ 下一轮组装</text>
  <text x="509" y="104" fill="#334155" font-size="9.5" text-anchor="middle">PromptBuilder 拼 [2] 记忆段</text>

  <rect x="616" y="56" width="170" height="76" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="701" y="82" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">④ 现读即生效</text>
  <text x="701" y="104" fill="#166534" font-size="9.5" text-anchor="middle">buildContext 每次重读</text>

  <line x1="210" y1="94" x2="226" y2="94" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>
  <line x1="402" y1="94" x2="418" y2="94" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>
  <line x1="594" y1="94" x2="610" y2="94" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#yks)"/>

  <!-- ════════ 结论行 ════════ -->
  <text x="410" y="180" fill="#64748b" font-size="12" text-anchor="middle">不缓存换来「记完立刻生效」——中间不用等任何刷新或过期（契约一）</text>
</svg>
